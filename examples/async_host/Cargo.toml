[package]
name = "vibe-async-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[dependencies]
wasmtime = { version = "45.0.0", features = ["component-model"] }
anyhow = "1.0"
futures = "0.3"

[[bin]]
name = "vibe-async-host"
path = "src/main.rs"

[[bin]]
name = "vibe-real-async-host"
path = "src/real_async.rs"

[[bin]]
name = "vibe-sleep-host"
path = "src/sleep_host.rs"
