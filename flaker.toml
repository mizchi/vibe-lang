[repo]
owner = "mizchi"
name = "vibe-lang"

[storage]
path = ".flaker/data.duckdb"

[adapter]
type = "custom"
command = "moon test --target js"

[runner]
type = "moontest"
command = "moon test --target js -v"

[affected]
resolver = "moon"
config = ""

[quarantine]
auto = true
flaky_rate_threshold = 0.3
min_runs = 5

[flaky]
window_days = 14
detection_threshold = 0.1

[sampling]
strategy = "hybrid"
percentage = 30
holdout_ratio = 0.1
co_failure_days = 90

[profile.scheduled]
strategy = "full"

[profile.ci]
strategy = "hybrid"
percentage = 30
adaptive = true
adaptive_min_percentage = 15

[profile.local]
strategy = "affected"
max_duration_seconds = 120
fallback_strategy = "weighted"
