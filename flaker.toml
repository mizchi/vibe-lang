[repo]
owner = "mizchi"
name = "vibe-lang"

[storage]
path = ".flaker/data.duckdb"

[adapter]
type = "moontest"
artifact_name = "moontest-results"

[runner]
type = "moontest"
command = "moon test --target js -v"

[affected]
resolver = "moon"
config = ""

[quarantine]
auto = true
flaky_rate_threshold_percentage = 30
min_runs = 5

[flaky]
window_days = 14
detection_threshold_ratio = 0.1

[sampling]
strategy = "hybrid"
sample_percentage = 30
holdout_ratio = 0.1
co_failure_window_days = 90

[profile.scheduled]
strategy = "full"

[profile.ci]
strategy = "hybrid"
sample_percentage = 30
adaptive = true
adaptive_min_percentage = 15
fallback_strategy = "weighted"

[profile.local]
strategy = "affected"
sample_percentage = 10
holdout_ratio = 0
max_duration_seconds = 120
fallback_strategy = "weighted"
