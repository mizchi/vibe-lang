<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vibe playground</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101318; color: #ebf0f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { max-width: 1400px; margin: 0 auto; padding: 28px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 44px); }
    p { margin: 0; color: #aeb9c8; line-height: 1.5; }
    code { color: #abd9fc; }
    #build-meta { color: #aeb9c8; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px; background: #1a2029; border: 1px solid #3b4654; border-radius: 12px 12px 0 0; }
    label { font-size: 14px; color: #aeb9c8; }
    select, button { font: inherit; border: 1px solid #506176; border-radius: 7px; padding: 8px 12px; background: #243041; color: #fff; }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: #334861; }
    button:disabled { opacity: .5; cursor: wait; }
    #btn-run { background: #1765b1; border-color: #3480cb; font-weight: 700; }
    #status { margin-left: auto; color: #a6e5bd; font-size: 14px; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); min-height: 540px; border: 1px solid #3b4654; border-top: 0; border-radius: 0 0 12px 12px; overflow: hidden; }
    #editor-container { min-height: 540px; }
    .result { border-left: 1px solid #3b4654; background: #151b23; padding: 20px; }
    .result h2 { font-size: 15px; margin: 0 0 18px; color: #aeb9c8; }
    #output { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    #output.error { color: #ff9a9a; }
    @media (max-width: 800px) { .shell { padding: 12px; } main { grid-template-columns: 1fr; } #editor-container { min-height: 420px; } .result { border-left: 0; border-top: 1px solid #3b4654; min-height: 140px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>vibe playground</h1>
        <p>Edit a preset and run it in your browser. The source must export <code>_start</code>.</p>
      </div>
      <span id="build-meta">Loading compiler...</span>
    </header>
    <div class="toolbar">
      <label for="preset-select">Preset</label>
      <select id="preset-select" aria-label="Code preset">
        <option value="effects-error">Effects + Exception</option>
        <option value="enum-match">Enum + Match</option>
        <option value="collections">Collections</option>
        <option value="suberror">Suberror</option>
        <option value="custom">Custom</option>
      </select>
      <button id="btn-run" disabled>Run</button>
      <button id="btn-share">Share URL</button>
      <span id="status">Loading compiler...</span>
    </div>
    <main>
      <div id="editor-container"></div>
      <section class="result" aria-label="Program output">
        <h2>Output</h2>
        <pre id="output">Run a program to see its output.</pre>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
