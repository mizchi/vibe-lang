<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vibe playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: #16213e;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #0f3460;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e94560;
    }
    #status {
      font-size: 13px;
      color: #888;
    }
    #status.ready { color: #4ecca3; }
    #status.error { color: #e94560; }
    .toolbar {
      padding: 8px 20px;
      background: #16213e;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    .toolbar select {
      padding: 6px 12px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
      min-width: 180px;
    }
    .toolbar .spacer {
      flex: 1;
    }
    button {
      padding: 6px 16px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #1a1a2e;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #0f3460; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #e94560; border-color: #e94560; color: #fff; }
    button.primary:hover { background: #c73650; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 12px 20px;
      gap: 12px;
    }
    textarea {
      flex: 1;
      min-height: 120px;
      background: #0d1117;
      color: #e0e0e0;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 12px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      tab-size: 2;
    }
    textarea:focus { outline: 1px solid #e94560; }
    #output {
      min-height: 80px;
      max-height: 260px;
      overflow-y: auto;
      background: #0d1117;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 12px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .panes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }
    .panel {
      min-height: 140px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .panel-title {
      font-size: 12px;
      color: #8db2ff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #diagnostics {
      min-height: 80px;
      max-height: 260px;
      overflow-y: auto;
      background: #0d1117;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 12px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .diag-summary {
      color: #8db2ff;
      margin-bottom: 8px;
      font-size: 11px;
    }
    .diag-empty {
      color: #888;
    }
    .diag-item {
      margin-bottom: 8px;
    }
    .diag-item.error {
      color: #ff7b7b;
    }
    .diag-item.warning {
      color: #ffd479;
    }
    .result-ok { color: #4ecca3; }
    .result-error { color: #e94560; }
    .result-type { color: #888; }
    .shortcut {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-left: 4px;
    }
    @media (max-width: 900px) {
      .panes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>vibe playground</h1>
    <span id="status">Loading WASM...</span>
  </header>
  <div class="toolbar">
    <select id="preset-select" aria-label="Code preset">
      <option value="fib">Preset: Fibonacci</option>
      <option value="map-filter">Preset: Map + Filter</option>
      <option value="parse-double">Preset: parse_double</option>
      <option value="custom">Custom</option>
    </select>
    <button id="btn-run" class="primary" disabled>Run <span class="shortcut">Ctrl+Enter</span></button>
    <button id="btn-reset" disabled>Reset Session</button>
    <span class="spacer"></span>
    <button id="btn-share">Share URL</button>
  </div>
<main>
    <textarea id="editor" spellcheck="false">let rec fib = (n: Int) -> Int {
  match n {
    0 => 0,
    1 => 1,
    _ => fib(n - 1) + fib(n - 2),
  }
}
fib(10)</textarea>
    <div class="panes">
      <section class="panel">
        <h2 class="panel-title">Output</h2>
        <div id="output"></div>
      </section>
      <section class="panel">
        <h2 class="panel-title">Diagnostics</h2>
        <div id="diagnostics"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
