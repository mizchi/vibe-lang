[package]
name = "moonrun_wt_client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust client for vibewt --daemon line-delimited JSON protocol"

[lib]
name = "moonrun_wt_client"
path = "src/lib.rs"

[[bin]]
name = "moonrun_wt_client"
path = "src/bin/moonrun_wt_client.rs"

[dependencies]
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
