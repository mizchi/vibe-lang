[package]
name = "viberun"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[[bin]]
name = "viberun"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
wasmtime = { version = "45.0.0", features = ["gc-drc"] }
# #1226: Http::request/response_*/close host imports. Blocking client (matches
# this runtime's synchronous func_wrap ABI, same convention as every other
# host import here), pure-Rust TLS (rustls) to avoid an OpenSSL system dep.
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = "thin"
