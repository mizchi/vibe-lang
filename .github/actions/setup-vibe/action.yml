name: Setup Vibe
description: Install optional toolchains (node, wasmtime, wasm-tools, pkfire) for Vibe CI

inputs:
  wasmtime:
    description: Install wasmtime
    default: 'false'
  pkfire:
    description: Install pkl + pkfire (pkf) — replaces just
    default: 'false'
  ripgrep:
    description: Install ripgrep
    default: 'false'
  wasm-tools:
    description: Install wasm-tools
    default: 'false'
  node-version:
    description: Node version (empty=skip)
    default: ''
  vibe-debug-cache:
    description: Cache vibe linked build artifacts (dist/cache)
    default: 'false'
  pkfire-cache:
    description: Cache ~/.cache/pkfire-mbt (content-addressed task cache)
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    # The MoonBit toolchain steps that used to live here — ~/.moon cache
    # restore/save, scripts/install_moonbit.sh, the $HOME/.moon/bin PATH entry,
    # and the .moon-version stamp that keyed the downstream `moonbit-build`
    # cache (ADR-0049) — were removed with the host itself (#594). They ran a
    # no-op installer, cached an empty directory, and stamped an empty file from
    # a `moon` binary that is never installed.

    - name: Install ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ripgrep

    - name: Restore pkfire binaries
      if: inputs.pkfire == 'true'
      id: pkfire-binaries
      uses: actions/cache/restore@v5
      with:
        path: ~/.local/share/vibe-pkfire
        key: pkfire-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/pkfire-version', 'scripts/install_pkfire_release.sh') }}

    - name: Install pkfire (cache miss)
      if: inputs.pkfire == 'true' && steps.pkfire-binaries.outputs.cache-hit != 'true'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/install_pkfire_release.sh"

    - name: Save pkfire binaries
      if: inputs.pkfire == 'true' && steps.pkfire-binaries.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.local/share/vibe-pkfire
        key: ${{ steps.pkfire-binaries.outputs.cache-primary-key }}

    - name: Add pkfire to PATH
      if: inputs.pkfire == 'true'
      shell: bash
      run: echo "$HOME/.local/share/vibe-pkfire/bin" >> "$GITHUB_PATH"

    - name: Assert the pinned pkfire is what got installed
      if: inputs.pkfire == 'true'
      shell: bash
      # Check the executable selected by PATH on both cache hits and misses.
      run: |
        set -euo pipefail
        want="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.github/pkfire-version")"
        got="$(pkf version 2>/dev/null | tr -d '[:space:]')"
        if [ "$got" != "$want" ]; then
          echo "::error::pkfire pin not honoured: .github/pkfire-version says $want, installed $got" >&2
          exit 1
        fi
        echo "[pkfire] pinned $want, installed $got"

    # The Pkl package Taskfile.pkl amends (`pkfire@X`) is downloaded by pkf at
    # evaluation time. Uncached, that download lands inside whichever step
    # first runs pkf, and a transient fetch error there fails a correctness
    # gate for a reason unrelated to what it checks (CI run 35916386839,
    # check_task_env_sanitized_test.sh). Cache the package, which is
    # immutable per version, and warm it here with retries. This is NOT the
    # task-output cache (~/.cache/pkfire-mbt, `pkfire-cache` below), which
    # could replay a run that did not happen; a package archive cannot.
    - name: Pkl package pin
      if: inputs.pkfire == 'true'
      id: pkl-package
      shell: bash
      run: |
        pin="$(sed -n 's|^amends "package://pkg\.pkl-lang\.org/\([^#"]*\)#.*|\1|p' "$GITHUB_WORKSPACE/Taskfile.pkl" | head -n 1 | tr '/@' '--')"
        echo "pin=${pin:-none}" >> "$GITHUB_OUTPUT"

    - name: Restore Pkl package cache
      if: inputs.pkfire == 'true'
      id: pkl-package-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/pkl-mbt
        key: pkl-mbt-packages-${{ runner.os }}-${{ steps.pkl-package.outputs.pin }}

    - name: Warm Pkl package cache
      if: inputs.pkfire == 'true'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/warm_pkl_package_cache.sh"

    - name: Save Pkl package cache
      if: inputs.pkfire == 'true' && steps.pkl-package-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/pkl-mbt
        key: ${{ steps.pkl-package-cache.outputs.cache-primary-key }}

    # pkfire content-addressed CAS cache. Use restore+save semantics so
    # cache hits short-circuit task replay even when inputs hash drifts;
    # the auto-save post-job hook persists fresh entries. Keys are
    # intentionally coarse — pkfire's own action-key already deduplicates
    # per-task work inside the cache directory.
    - name: Cache pkfire CAS
      if: inputs.pkfire-cache == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.cache/pkfire-mbt
        key: pkfire-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Taskfile.pkl') }}-${{ github.sha }}
        restore-keys: |
          pkfire-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Taskfile.pkl') }}-
          pkfire-${{ runner.os }}-${{ github.job }}-
          pkfire-${{ runner.os }}-

    # Cache wasmtime release tarball extraction. WASMTIME_VERSION is pinned
    # in install_wasmtime_release.sh; key includes the file's hash so any
    # bump invalidates the cache.
    - name: Restore wasmtime cache
      if: inputs.wasmtime == 'true'
      id: wasmtime-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.wasmtime
        key: wasmtime-${{ runner.os }}-${{ hashFiles('scripts/install_wasmtime_release.sh') }}

    - name: Install wasmtime (cache miss)
      if: inputs.wasmtime == 'true' && steps.wasmtime-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/install_wasmtime_release.sh"

    - name: Save wasmtime cache
      if: inputs.wasmtime == 'true' && steps.wasmtime-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.wasmtime
        key: ${{ steps.wasmtime-cache.outputs.cache-primary-key }}

    - name: Add wasmtime to PATH
      if: inputs.wasmtime == 'true'
      shell: bash
      run: echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

    - name: Install wasm-tools
      if: inputs.wasm-tools == 'true'
      shell: bash
      run: |
        WASM_TOOLS_VERSION=1.245.1
        curl -fsSL --retry 5 --retry-all-errors \
          -o /tmp/wasm-tools.tar.gz \
          "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
        tar xzf /tmp/wasm-tools.tar.gz -C /tmp
        sudo install -m 0755 "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
        wasm-tools --version

    - name: Cache vibe linked build
      if: inputs.vibe-debug-cache == 'true'
      uses: actions/cache@v5
      with:
        path: vibe/.vibe/debug
        key: vibe-debug-${{ runner.os }}-${{ hashFiles('vibe/**/*.vibe') }}
        restore-keys: |
          vibe-debug-${{ runner.os }}-
