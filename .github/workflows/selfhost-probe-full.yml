name: Selfhost Probe Full

on:
  workflow_dispatch:

jobs:
  selfhost-probe-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIBE_SELFHOST_PROBE_FULL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Run full selfhost probe (vibe wasm eval test index 44)
        run: moon test -p tests -f vibe_wasm_eval_test.mbt --target js --warn-list '-29' --index 44
