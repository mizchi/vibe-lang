name: pkfire validation

# Focused validation gate. Now that main CI drives every job through
# `pkf run …`, the broken-Taskfile case fails the main CI loudly enough.
# This workflow narrows to the things main CI does NOT exercise:
#
#   - `pkf format --check` and `pkf lint` — style gate, can fail fast
#     before the slower main CI matrix even starts.
#
# (The pkspec-based spec↔test coverage gate that used to run here was
# dropped: `pkspec/VibeSpec.pkl`/`VibeTest.pkl` were never wired into the
# main task graph and had sat unused since they were added — see
# docs/pkfire-pkspec.md. `pkspec/Packages.pkl` remains; Taskfile.pkl
# imports it directly to generate the per-package `test:<pkg>` tasks.)
#
# Required (no continue-on-error). The cost is sub-10s per PR and the
# failure mode is unambiguous.
on:
  pull_request:
    paths:
      - 'Taskfile.pkl'
      - 'scripts/pkfire/**'
      - 'pkspec/**'
      - '.github/workflows/pkfire-pkspec.yml'
  push:
    branches:
      - main
    paths:
      - 'Taskfile.pkl'
      - 'scripts/pkfire/**'
      - 'pkspec/**'

jobs:
  validate:
    name: validate Pkl configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pkfire (pkf)
        uses: mizchi/pkfire@v0.10.0
        with:
          version: pkfire@0.10.0

      - name: pkf format --check
        run: pkf format --check Taskfile.pkl

      - name: pkf lint
        run: pkf lint
