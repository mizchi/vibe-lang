name: pkfire validation

# Focused validation gate. Now that main CI drives every job through
# `pkf run …`, the broken-Taskfile case fails the main CI loudly enough.
# This workflow narrows to the things main CI does NOT exercise:
#
#   - `pkf format --check` and `pkf lint` — style gate, can fail fast
#     before the slower main CI matrix even starts.
#
# (The pkspec-based spec↔test coverage gate that used to run here was
# dropped: `pkspec/VibeSpec.pkl`/`VibeTest.pkl` were never wired into the
# main task graph and had sat unused since they were added — see
# docs/pkfire-pkspec.md. `pkspec/Packages.pkl` went with the per-package
# `test:<pkg>` tasks in #881/#987 and Taskfile.pkl imports nothing from
# pkspec any more, so the directory — by then just a .gitignore for schemas
# nothing regenerates — was deleted too.)
#
# Required (no continue-on-error). The cost is sub-10s per PR and the
# failure mode is unambiguous.
on:
  pull_request:
    paths:
      - 'Taskfile.pkl'
      - 'scripts/pkfire/**'
      - '.github/workflows/pkfire-pkspec.yml'
  push:
    branches:
      - main
    paths:
      - 'Taskfile.pkl'
      - 'scripts/pkfire/**'

jobs:
  validate:
    name: validate Pkl configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pkfire (pkf)
        # MoonBit build (>= v0.12). Tags up to v0.10.0 were the retired Go
        # implementation — never pin below v0.12. Keep in sync with
        # .github/actions/setup-vibe/action.yml and .claude/hooks/session-start.sh.
        uses: mizchi/pkfire@v0.14.2
        with:
          # The RELEASE to install; the ref alone does not select it.
          version: 0.14.2

      - name: Assert the pinned pkfire is what got installed
        # See .github/actions/setup-vibe/action.yml: the ref names the action,
        # not the pkf release, and an unpassed version input resolves "latest".
        run: |
          set -euo pipefail
          want="$(tr -d '[:space:]' < .github/pkfire-version)"
          got="$(pkf version 2>/dev/null | tr -d '[:space:]')"
          if [ "$got" != "$want" ]; then
            echo "::error::pkfire pin not honoured: .github/pkfire-version says $want, installed $got" >&2
            exit 1
          fi
          echo "[pkfire] pinned $want, installed $got"

      - name: pkf format --check
        run: pkf format --check Taskfile.pkl

      - name: pkf lint
        run: pkf lint
