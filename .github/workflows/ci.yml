name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  VIBE_MOON_WARN_LIST: "-1-6-7-9-20-24-27-29"

jobs:
  lint-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  contract-moon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          just: 'true'

      - name: Run moon test (verbose, for flaker)
        run: |
          moon test --target js -v 2>&1 | tee .flaker-test-output.txt || true

      - name: Upload test results for flaker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moontest-results
          path: .flaker-test-output.txt
          retention-days: 30

      - name: PR contract checks (MoonBit/js)
        run: just ci-contract-moon

  contract-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          just: 'true'
          wasmtime: 'true'
          vibe-debug-cache: 'true'

      - name: PR contract checks (native/runtime)
        run: just ci-contract-native

  native-binary-parity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          just: 'true'
          wasmtime: 'true'
          wasm-tools: 'true'
          vibe-debug-cache: 'true'

      - name: Native binary parity checks
        run: just ci-native-binary-parity

  bundle-size-compiler:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'

      - name: Compiler bundle-size golden
        continue-on-error: true
        run: scripts/bench_compiler_bundle_size.sh

  bundle-size-product-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'

      - name: Product bundle-size gate
        id: product_bundle_size
        continue-on-error: true
        run: scripts/bench_bundle_size.sh

      - name: Product bundle-size summary
        if: always()
        run: |
          echo "### Product WASM Bundle Size" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.product_bundle_size.outcome }}" = "success" ]; then
            echo "- Status: within budget" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: regression detected (blocking gate)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f dist/bundle_size/current.tsv ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current report: \`dist/bundle_size/current.tsv\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload product bundle-size report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bundle-size-product-report
          path: dist/bundle_size/current.tsv
          if-no-files-found: ignore

  wasm-vibe-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'

      - name: Build wasm/vibe artifact
        run: |
          moon build --target wasm-gc --release src/lib
          mkdir -p wasm/vibe
          cp _build/wasm-gc/release/build/lib/lib.wasm wasm/vibe/vibe.wasm

      - name: Smoke test wasm/vibe with wasmtime
        run: ./scripts/test_wasm_vibe_wasmtime.sh wasm/vibe/vibe.wasm

  wasm-codegen-quick:
    if: github.event_name == 'push'
    name: wasm-codegen-quick (${{ matrix.shard }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [core, compare, http]
    steps:
      - uses: actions/checkout@v5
      - name: Init wasmtime submodule
        if: matrix.shard == 'http'
        run: git submodule update --init deps/wasmtime
      - name: Install Rust toolchain
        if: matrix.shard == 'http'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        if: matrix.shard == 'http'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-wasm-quick-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build_wasi_http_p3*.sh') }}
          restore-keys: cargo-wasm-quick-${{ runner.os }}-
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          just: 'true'
          wasmtime: 'true'
          wasm-tools: 'true'
          node-version: '24'
      - name: Build vibe CLI (native debug)
        run: VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Set VIBE_BIN for debug binary
        run: echo "VIBE_BIN=$(pwd)/_build/native/debug/build/cmd/vibe/vibe.exe" >> "$GITHUB_ENV"
      - name: Run wasm quick shard (${{ matrix.shard }})
        run: just ci-wasm-quick-shard ${{ matrix.shard }}

  wasm-parity:
    name: wasm-parity (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: handle
            suite: handle
            shard_index: 0
            shard_total: 1
          - name: pattern (0)
            suite: pattern
            shard_index: 0
            shard_total: 2
          - name: pattern (1)
            suite: pattern
            shard_index: 1
            shard_total: 2
    steps:
      - uses: actions/checkout@v5
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Set VIBE_BIN for release binary
        run: echo "VIBE_BIN=$(pwd)/target/native/release/build/cmd/vibe/vibe.exe" >> "$GITHUB_ENV"
      - name: Run wasm parity suite (${{ matrix.name }})
        id: wasm_parity_suite
        run: |
          case "${{ matrix.suite }}" in
            handle)
              ./scripts/test_handle_exception_wasm_match.sh
              ;;
            pattern)
              ./scripts/test_run_wasm_match.sh
              ;;
            *)
              echo "unknown wasm parity suite: ${{ matrix.suite }}" >&2
              exit 1
              ;;
          esac
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
      - name: WASM parity summary (${{ matrix.name }})
        if: always()
        run: |
          {
            echo "### WASM Parity: ${{ matrix.name }}"
            if [ "${{ steps.wasm_parity_suite.outcome }}" = "success" ]; then
              echo "- Status: passed"
            else
              echo "- Status: regression detected"
              echo "- Repro: \`./scripts/test_handle_exception_wasm_match.sh\` or \`./scripts/test_run_wasm_match.sh\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  wasm-compile-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: WASM compile E2E (shard ${{ matrix.shard }}/4)
        id: wasm_compile_e2e
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        run: ./scripts/test_wasm_compile_wasmtime.sh
      - name: WASM compile E2E summary (shard ${{ matrix.shard }}/4)
        if: always()
        run: |
          {
            echo "### WASM Compile E2E: shard ${{ matrix.shard }}/4"
            if [ "${{ steps.wasm_compile_e2e.conclusion }}" = "success" ]; then
              echo "- Status: passed"
            else
              echo "- Status: failed"
              echo "- Repro: \`SHARD_INDEX=${{ matrix.shard }} SHARD_TOTAL=4 ./scripts/test_wasm_compile_wasmtime.sh\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  selfhost-gates:
    if: github.event_name == 'push'
    name: selfhost-gates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [bootstrap, cli, check]
    steps:
      - uses: actions/checkout@v5
      - name: Init wasmtime submodule
        run: git submodule update --init deps/wasmtime
      - name: Install Rust toolchain
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-selfhost-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build_selfhost_*component*.sh') }}
          restore-keys: cargo-selfhost-${{ runner.os }}-
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          just: 'true'
          wasmtime: 'true'
          wasm-tools: 'true'
          node-version: '24'
      - name: Install wac
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        run: |
          if ! command -v wac >/dev/null 2>&1; then
            cargo install wac-cli --version 0.9.0 --locked
          fi
      - name: Build vibe CLI (native debug)
        run: VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Set VIBE_BIN for debug binary
        run: echo "VIBE_BIN=$(pwd)/_build/native/debug/build/cmd/vibe/vibe.exe" >> "$GITHUB_ENV"
      - name: Run selfhost gate shard (${{ matrix.shard }})
        run: just ci-selfhost-gates-shard ${{ matrix.shard }}

  e2e-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'
          wasm-tools: 'true'
          node-version: '24'

      - name: Run Component E2E tests
        run: ./scripts/test_component_e2e.sh

  selfhost-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          just: 'true'
          wasmtime: 'true'
          node-version: '24'

      - name: Build selfhost compiler
        run: just build-selfhost-dist-raw

      - name: Selfhost examples compile+run
        run: just ci-selfhost-examples-smoke

      - name: wasm-gc validation gate
        run: just test-wasm-gc-validate

      - name: Selfhost runtime fixtures
        id: selfhost_runtime_fixtures
        if: always()
        run: |
          set +e
          bash scripts/test_selfhost_runtime_fixtures.sh
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Selfhost runtime fixtures summary
        if: always()
        run: |
          {
            echo "### Selfhost Runtime Fixtures"
            if [ "${{ steps.selfhost_runtime_fixtures.outputs.exit_code }}" = "0" ]; then
              echo "- Status: passed"
            else
              echo "- Status: drift or runtime regression detected (non-blocking)"
              echo "- Repro: \`bash scripts/test_selfhost_runtime_fixtures.sh\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-selfhost-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          just: 'true'
          wasmtime: 'true'
          node-version: '24'

      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'

      - name: Run selfhost perf KPI
        env:
          VIBE_USE_SESSION_HTTP: '0'
        # RUNS=3: median of 3 samples reduces variance enough to keep ratio
        # under the 8.0/5.5 budget across CI runner spec drift. RUNS=1 was
        # flaky enough that single outliers tripped the gate.
        run: just test-selfhost-perf-gate 3 8.0 5.5 bench/selfhost_perf/kpi_cases.txt

      - name: Run selfhost suite coverage gate
        env:
          VIBE_USE_SESSION_HTTP: '0'
        run: just coverage-selfhost-suite-gate

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Selfhost Suite Coverage"
            if [ -f _build/coverage/selfhost-suite/selfhost_suite.summary.txt ]; then
              echo '```'
              cat _build/coverage/selfhost-suite/selfhost_suite.summary.txt
              echo '```'
            else
              echo "- No summary produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selfhost-suite-coverage-report
          path: |
            _build/coverage/selfhost-suite/selfhost_suite.summary.txt
            _build/coverage/selfhost-suite/selfhost_suite.report.json
          if-no-files-found: ignore

  similarity-mbt-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache similarity-mbt binary
        id: similarity-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/similarity-mbt
          key: similarity-mbt-${{ runner.os }}-v0.5.2

      - name: Install similarity-mbt
        if: steps.similarity-cache.outputs.cache-hit != 'true'
        run: cargo install similarity-mbt --version 0.5.2 --locked

      - name: Run similarity-mbt
        id: sim
        run: |
          set +e
          similarity-mbt src/ --threshold 0.98 > sim-report.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          lines=$(wc -l < sim-report.txt)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Similarity summary
        if: always()
        run: |
          {
            echo "### similarity-mbt duplicate report (threshold 0.98)"
            echo ""
            echo "- Report lines: ${{ steps.sim.outputs.lines }}"
            echo ""
            echo '```'
            head -120 sim-report.txt || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload similarity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: similarity-mbt-report
          path: sim-report.txt
          if-no-files-found: ignore

  ci-required:
    if: always()
    needs:
      - lint-ci
      - contract-moon
      - contract-native
      - e2e-component
      - selfhost-examples
      - wasm-compile-e2e
      - wasm-parity
      - wasm-vibe-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check required CI job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled"
            echo ""
            echo "Job results:"
            echo "  lint-ci: ${{ needs.lint-ci.result }}"
            echo "  contract-moon: ${{ needs.contract-moon.result }}"
            echo "  contract-native: ${{ needs.contract-native.result }}"
            echo "  e2e-component: ${{ needs.e2e-component.result }}"
            echo "  selfhost-examples: ${{ needs.selfhost-examples.result }}"
            echo "  wasm-compile-e2e: ${{ needs.wasm-compile-e2e.result }}"
            echo "  wasm-parity: ${{ needs.wasm-parity.result }}"
            echo "  wasm-vibe-smoke: ${{ needs.wasm-vibe-smoke.result }}"
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."

  ci-informational:
    if: always()
    needs:
      - bundle-size-compiler
      - bundle-size-product-gate
      - coverage-selfhost-suite
      - native-binary-parity
      - selfhost-gates
      - similarity-mbt-report
      - wasm-codegen-quick
    runs-on: ubuntu-latest
    steps:
      - name: Report informational CI job results
        run: |
          echo "Informational job results (non-blocking):"
          echo "  bundle-size-compiler: ${{ needs.bundle-size-compiler.result }}"
          echo "  bundle-size-product-gate: ${{ needs.bundle-size-product-gate.result }}"
          echo "  coverage-selfhost-suite: ${{ needs.coverage-selfhost-suite.result }}"
          echo "  native-binary-parity: ${{ needs.native-binary-parity.result }}"
          echo "  selfhost-gates: ${{ needs.selfhost-gates.result }}"
          echo "  similarity-mbt-report: ${{ needs.similarity-mbt-report.result }}"
          echo "  wasm-codegen-quick: ${{ needs.wasm-codegen-quick.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo ""
            echo "::warning::Some informational jobs failed (non-blocking)"
          fi
