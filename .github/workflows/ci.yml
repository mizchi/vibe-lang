name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  VIBE_MOON_WARN_LIST: "-1-6-7-9-20-24-29"

jobs:
  lint-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  contract-moon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Install just
        run: |
          JUST_VERSION=1.48.1
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Moon update
        run: moon update

      - name: PR contract checks (MoonBit/js)
        run: just ci-contract-moon

  contract-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install just
        run: |
          JUST_VERSION=1.48.1
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Cache vibe linked build
        uses: actions/cache@v4
        with:
          path: vibe/.vibe/debug
          key: vibe-debug-${{ runner.os }}-${{ hashFiles('vibe/**/*.vibe') }}
          restore-keys: vibe-debug-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: PR contract checks (native/runtime)
        run: just ci-contract-native

  native-binary-parity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install just
        run: |
          JUST_VERSION=1.48.1
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Cache vibe linked build
        uses: actions/cache@v4
        with:
          path: vibe/.vibe/debug
          key: vibe-debug-${{ runner.os }}-${{ hashFiles('vibe/**/*.vibe') }}
          restore-keys: vibe-debug-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Native binary parity checks
        run: just ci-native-binary-parity

  bundle-size-compiler:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Compiler bundle-size golden
        continue-on-error: true
        run: scripts/bench_compiler_bundle_size.sh

  bundle-size-product-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Product bundle-size gate
        id: product_bundle_size
        continue-on-error: true
        run: scripts/bench_bundle_size.sh

      - name: Product bundle-size summary
        if: always()
        run: |
          echo "### Product WASM Bundle Size" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.product_bundle_size.outcome }}" = "success" ]; then
            echo "- Status: within budget" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: regression detected (blocking gate)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f dist/bundle_size/current.tsv ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current report: \`dist/bundle_size/current.tsv\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload product bundle-size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-product-report
          path: dist/bundle_size/current.tsv
          if-no-files-found: ignore

  wasm-vibe-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Build wasm/vibe artifact
        run: |
          moon build --target wasm-gc --release src/lib
          mkdir -p wasm/vibe
          cp _build/wasm-gc/release/build/lib/lib.wasm wasm/vibe/vibe.wasm

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Smoke test wasm/vibe with wasmtime
        run: ./scripts/test_wasm_vibe_wasmtime.sh wasm/vibe/vibe.wasm

  wasm-codegen-quick:
    if: github.event_name == 'push'
    name: wasm-codegen-quick (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core, compare, http]
    steps:
      - uses: actions/checkout@v4
      - name: Init wasmtime submodule
        if: matrix.shard == 'http'
        run: git submodule update --init deps/wasmtime
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Rust toolchain
        if: matrix.shard == 'http'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        if: matrix.shard == 'http'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-wasm-quick-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build_wasi_http_p3*.sh') }}
          restore-keys: cargo-wasm-quick-${{ runner.os }}-
      - name: Install just
        run: |
          JUST_VERSION=1.48.1
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-
      - name: Moon update
        run: moon update
      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.245.1-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.245.1-x86_64-linux/wasm-tools /usr/local/bin/
      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Run wasm quick shard (${{ matrix.shard }})
        run: just ci-wasm-quick-shard ${{ matrix.shard }}

  wasm-parity:
    name: wasm-parity (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: handle
            suite: handle
            shard_index: 0
            shard_total: 1
          - name: pattern (0)
            suite: pattern
            shard_index: 0
            shard_total: 2
          - name: pattern (1)
            suite: pattern
            shard_index: 1
            shard_total: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-
      - name: Moon update
        run: moon update
      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Run wasm parity suite (${{ matrix.name }})
        continue-on-error: true
        run: |
          case "${{ matrix.suite }}" in
            handle)
              ./scripts/test_handle_exception_wasm_match.sh
              ;;
            pattern)
              ./scripts/test_interpreter_wasm_match.sh
              ;;
            *)
              echo "unknown wasm parity suite: ${{ matrix.suite }}" >&2
              exit 1
              ;;
          esac
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}

  wasm-compile-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-
      - name: Moon update
        run: moon update
      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: WASM compile E2E (shard ${{ matrix.shard }}/4)
        continue-on-error: true
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        run: ./scripts/test_wasm_compile_wasmtime.sh

  selfhost-gates:
    if: github.event_name == 'push'
    name: selfhost-gates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [bootstrap, cli, check]
    steps:
      - uses: actions/checkout@v4
      - name: Init wasmtime submodule
        run: git submodule update --init deps/wasmtime
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Rust toolchain
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-selfhost-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build_selfhost_*component*.sh') }}
          restore-keys: cargo-selfhost-${{ runner.os }}-
      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-
      - name: Moon update
        run: moon update
      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.245.1-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.245.1-x86_64-linux/wasm-tools /usr/local/bin/
      - name: Install wac
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        run: |
          if ! command -v wac >/dev/null 2>&1; then
            cargo install wac-cli --version 0.9.0 --locked
          fi
      - name: Install just
        run: |
          JUST_VERSION=1.48.1
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Run selfhost gate shard (${{ matrix.shard }})
        run: just ci-selfhost-gates-shard ${{ matrix.shard }}

  e2e-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.245.1-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.245.1-x86_64-linux/wasm-tools /usr/local/bin/
          wasm-tools --version

      - name: Run Component E2E tests
        run: ./scripts/test_component_e2e.sh

  selfhost-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Install just
        run: |
          JUST_VERSION=1.48.1
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build selfhost compiler
        id: selfhost_build
        continue-on-error: true
        run: just build-selfhost-dist-raw

      - name: Selfhost examples compile+run
        if: steps.selfhost_build.outcome == 'success'
        run: just ci-selfhost-examples-smoke

      - name: Selfhost runtime fixtures
        if: always()
        continue-on-error: true
        run: bash scripts/test_selfhost_runtime_fixtures.sh

  coverage-selfhost-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install just
        run: |
          JUST_VERSION=1.48.1
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'

      - name: Run selfhost perf KPI
        env:
          VIBE_USE_SESSION_HTTP: '0'
        run: just test-selfhost-perf-gate 1 8.0 5.5 bench/selfhost_perf/kpi_cases.txt

      - name: Run selfhost suite coverage gate
        env:
          VIBE_USE_SESSION_HTTP: '0'
        run: just coverage-selfhost-suite-gate

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Selfhost Suite Coverage"
            if [ -f _build/coverage/selfhost-suite/selfhost_suite.summary.txt ]; then
              echo '```'
              cat _build/coverage/selfhost-suite/selfhost_suite.summary.txt
              echo '```'
            else
              echo "- No summary produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-suite-coverage-report
          path: |
            _build/coverage/selfhost-suite/selfhost_suite.summary.txt
            _build/coverage/selfhost-suite/selfhost_suite.report.json
          if-no-files-found: ignore

  ci-required:
    if: always()
    needs:
      - lint-ci
      - contract-moon
      - contract-native
      - coverage-selfhost-suite
      - e2e-component
      - selfhost-examples
      - wasm-vibe-smoke
      - wasm-compile-e2e
      - wasm-parity
    runs-on: ubuntu-latest
    steps:
      - name: Check required CI job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled"
            echo ""
            echo "Job results:"
            echo "  lint-ci: ${{ needs.lint-ci.result }}"
            echo "  contract-moon: ${{ needs.contract-moon.result }}"
            echo "  contract-native: ${{ needs.contract-native.result }}"
            echo "  coverage-selfhost-suite: ${{ needs.coverage-selfhost-suite.result }}"
            echo "  e2e-component: ${{ needs.e2e-component.result }}"
            echo "  selfhost-examples: ${{ needs.selfhost-examples.result }}"
            echo "  wasm-vibe-smoke: ${{ needs.wasm-vibe-smoke.result }}"
            echo "  wasm-compile-e2e: ${{ needs.wasm-compile-e2e.result }}"
            echo "  wasm-parity: ${{ needs.wasm-parity.result }}"
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."

  ci-informational:
    if: always()
    needs:
      - bundle-size-compiler
      - bundle-size-product-gate
      - native-binary-parity
      - selfhost-gates
      - wasm-codegen-quick
    runs-on: ubuntu-latest
    steps:
      - name: Report informational CI job results
        run: |
          echo "Informational job results (non-blocking):"
          echo "  bundle-size-compiler: ${{ needs.bundle-size-compiler.result }}"
          echo "  bundle-size-product-gate: ${{ needs.bundle-size-product-gate.result }}"
          echo "  native-binary-parity: ${{ needs.native-binary-parity.result }}"
          echo "  selfhost-gates: ${{ needs.selfhost-gates.result }}"
          echo "  wasm-codegen-quick: ${{ needs.wasm-codegen-quick.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo ""
            echo "::warning::Some informational jobs failed (non-blocking)"
          fi
