name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Cache vibe linked build
        uses: actions/cache@v4
        with:
          path: vibe/.vibe/debug
          key: vibe-debug-${{ runner.os }}-${{ hashFiles('vibe/**/*.vibe') }}
          restore-keys: vibe-debug-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Moon check
        run: moon check --target js

      - name: Moon test
        run: moon test --target js

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build vibe CLI (native release)
        run: VIBE_CLI_RELEASE=1 bash -c 'source scripts/ensure_native_cli.sh'

      - name: Fixture isolation test (crash/timeout detection)
        continue-on-error: true
        run: scripts/test_fixtures_isolation.sh

      - name: Build parity test (debug vs release)
        continue-on-error: true
        run: scripts/test_build_parity.sh

      - name: Vibe normalize check
        continue-on-error: true
        run: |
          moon build --target native src/cmd/vibe --warn-list '-29'
          start_ts=$(date +%s%N)
          scripts/vibe_normalize_all.sh --check examples vibe
          end_ts=$(date +%s%N)
          elapsed_ms=$(( (end_ts - start_ts) / 1000000 ))
          file_count=$(find examples vibe -name '*.vibe' -type f | grep -Ev '^examples/wasm/' | wc -l | tr -d ' ')
          echo "### Normalize Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Files | ${file_count} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total | ${elapsed_ms}ms |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$file_count" -gt 0 ]; then
            avg_us=$(( elapsed_ms * 1000 / file_count ))
            echo "| Per-file avg | ${avg_us}us |" >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle-size-compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Compiler bundle-size golden
        continue-on-error: true
        run: scripts/bench_compiler_bundle_size.sh

  bundle-size-product-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Product bundle-size gate
        id: product_bundle_size
        continue-on-error: true
        run: scripts/bench_bundle_size.sh

      - name: Product bundle-size summary
        if: always()
        run: |
          echo "### Product WASM Bundle Size" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.product_bundle_size.outcome }}" = "success" ]; then
            echo "- Status: within budget" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: regression detected (blocking gate)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f dist/bundle_size/current.tsv ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current report: \`dist/bundle_size/current.tsv\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload product bundle-size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-product-report
          path: dist/bundle_size/current.tsv
          if-no-files-found: ignore

  wasm-vibe-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Build wasm/vibe artifact
        run: |
          moon build --target wasm-gc --release src/lib
          mkdir -p wasm/vibe
          cp _build/wasm-gc/release/build/lib/lib.wasm wasm/vibe/vibe.wasm

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Smoke test wasm/vibe with wasmtime
        run: ./scripts/test_wasm_vibe_wasmtime.sh wasm/vibe/vibe.wasm

  wasm-codegen-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Check moon info regen cycle (idempotent + deny-warn check)
        continue-on-error: true
        run: bash scripts/test_moon_info_regen.sh

      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.245.1-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.245.1-x86_64-linux/wasm-tools /usr/local/bin/
          wasm-tools --version

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: WASI HTTP P3 blocked gate (monitor-only)
        continue-on-error: true
        run: |
          VIBE_WASI_HTTP_P3_REQUIRE_READY=0 \
          VIBE_WASI_HTTP_P3_RUN_COMPOSE=0 \
          ./scripts/test_wasi_http_p3_blocked_gate.sh

      - name: WASI P3 E2E (compile + compose + validate + serve)
        continue-on-error: true
        run: ./scripts/test_wasi_p3_e2e.sh

      - name: Build vibe CLI (native release)
        run: |
          VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
          VIBE_EXE=target/native/release/build/cmd/vibe/vibe.exe
          if [ -f "$VIBE_EXE" ]; then
            mkdir -p _build/native/release/build/cmd/vibe
            ln -sf "$(pwd)/$VIBE_EXE" _build/native/release/build/cmd/vibe/vibe.exe
          fi

      - name: Validate selfhost probe wasm fixture
        run: ./scripts/test_selfhost_probe_wasm_validate.sh

      - name: Check handle/exception interpreter vs wasm parity
        continue-on-error: true
        run: ./scripts/test_handle_exception_wasm_match.sh

      - name: Check interpreter vs wasm pattern match parity
        continue-on-error: true
        run: |
          VIBE_BIN=target/native/release/build/cmd/vibe/vibe.exe \
          ./scripts/test_interpreter_wasm_match.sh

      - name: WASM compile E2E (arithmetic, closures, patterns, recursion)
        continue-on-error: true
        run: |
          VIBE_BIN=target/native/release/build/cmd/vibe/vibe.exe \
          ./scripts/test_wasm_compile_wasmtime.sh

      - name: Golden WAT snapshot tests
        continue-on-error: true
        run: |
          VIBE_BIN=target/native/release/build/cmd/vibe/vibe.exe \
          ./scripts/test_golden_wat.sh

      - name: Check vibe vs vibe_wasm compare parity
        continue-on-error: true
        run: ./scripts/test_vibe_wasm_compare.sh

      - name: Check HTTP builtin wasm fallback (validate + catchable throw)
        continue-on-error: true
        run: ./scripts/test_http_wasm_fallback.sh

      - name: Check HTTP builtin wasm host-import path (capability + e2e)
        continue-on-error: true
        run: ./scripts/test_http_wasm_host_imports.sh

      - name: Check compiled backend HTTP policy (auto fallback / forced reject)
        continue-on-error: true
        run: ./scripts/test_compiled_backend_http_policy.sh

      - name: Check component import contract (stable func imports)
        continue-on-error: true
        run: ./scripts/test_component_import_contract.sh

      - name: HTTP P3 handler gate (component + validate + rejection)
        continue-on-error: true
        run: ./scripts/test_http_p3_handler_gate.sh

      - name: Selfhost bootstrap gate (compiled + probe + deterministic compile)
        continue-on-error: true
        run: |
          VIBE_BIN=target/native/release/build/cmd/vibe/vibe.exe \
          VIBE_SELFHOST_BOOTSTRAP_BASELINE_SEC=180 \
          VIBE_SELFHOST_BOOTSTRAP_REDUCTION_PCT=30 \
          VIBE_SELFHOST_BOOTSTRAP_STAGE_TIMEOUT_SEC=900 \
          ./scripts/test_selfhost_bootstrap_gate.sh

      - name: Selfhost WASI selfbuild gate (stage0 -> stage1 -> stage2)
        continue-on-error: true
        run: |
          VIBE_SELFHOST_SELFBUILD_STRICT_RECURSIVE=1 \
          VIBE_SELFHOST_SELFBUILD_REQUIRE_TRUE_RECURSIVE=1 \
          VIBE_SELFHOST_SELFBUILD_STAGE_TIMEOUT_SEC=600 \
          VIBE_SELFHOST_SELFBUILD_MAX_TOTAL_SEC=300 \
          ./scripts/test_selfhost_wasi_selfbuild.sh

      - name: Selfhost WASI HTTP boundary gate (component WIT imports)
        continue-on-error: true
        run: ./scripts/test_selfhost_wasi_http_boundary.sh

      - name: Selfhost check parity snapshot gate (diagnostic JSON diff)
        continue-on-error: true
        run: |
          VIBE_BIN=target/native/release/build/cmd/vibe/vibe.exe \
          VIBE_CHECK_PARITY_REQUIRE_PARITY=1 \
          ./scripts/test_selfhost_check_parity.sh

      - name: Selfhost perf KPI gate (compile/check ratio)
        continue-on-error: true
        run: |
          VIBE_SELFHOST_PERF_RUNS=1 \
          VIBE_SELFHOST_PERF_CASES_FILE=bench/selfhost_perf/kpi_cases.txt \
          VIBE_SELFHOST_PERF_MAX_COMPILE_RATIO=2.5 \
          VIBE_SELFHOST_PERF_MAX_CHECK_RATIO=0.8 \
          ./scripts/bench_selfhost_perf.sh

      - name: Selfhost cutover gate (CLI contract + artifact parity)
        continue-on-error: true
        run: |
          VIBE_BIN=target/native/release/build/cmd/vibe/vibe.exe \
          VIBE_CUTOVER_REQUIRE_PARITY=1 \
          VIBE_CUTOVER_INCLUDE_COMPILER_SIZE=1 \
          VIBE_CUTOVER_INCLUDE_FAIL_CASES=1 \
          VIBE_CUTOVER_REQUIRED_FAIL_CLASSES=parse,type,io \
          VIBE_CUTOVER_MODES=mvp,no-dce,debug-errors \
          VIBE_CUTOVER_STAGE_TIMEOUT_SEC=300 \
          ./scripts/test_selfhost_cutover_gate.sh

      - name: Selfhost suite coverage gate (workload + index invoke)
        continue-on-error: true
        run: just coverage-selfhost-suite-gate

  e2e-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit build
        uses: actions/cache@v4
        with:
          path: |
            _build
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'src/**/*.mbt') }}
          restore-keys: moonbit-${{ runner.os }}-

      - name: Moon update
        run: moon update

      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.245.1-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.245.1-x86_64-linux/wasm-tools /usr/local/bin/
          wasm-tools --version

      - name: Run Component E2E tests
        continue-on-error: true
        run: ./scripts/test_component_e2e.sh

      - name: WASI P3 E2E (compile + compose + validate)
        continue-on-error: true
        run: ./scripts/test_wasi_p3_e2e.sh

      - name: Run Codegen Unsupported Syntax tests
        continue-on-error: true
        run: ./scripts/test_codegen_unsupported.sh

  selfhost-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build selfhost compiler
        run: just build-selfhost-dist-raw

      - name: Selfhost examples compile+run
        run: |
          SELFHOST_WASM=_build/dist/selfhost_compiler.wasm
          mkdir -p _build/s1test
          ok=0; fail=0; total=0
          # syntax.vibe skipped: too large for CI WASM memory (works locally)
          for f in examples/*.vibe; do
            [ "$(basename "$f")" = "syntax.vibe" ] && continue
            name=$(basename "$f" .vibe)
            total=$((total + 1))
            rm -f "_build/s1test/${name}.wasm"
            compile_out=$(VIBE_PREOPEN_DIR="$(pwd)" bash scripts/run_wasm_vibe_host_runner.sh \
              "$SELFHOST_WASM" "$f" "_build/s1test/${name}.wasm" "run" 2>&1 || true)
            if [ -f "_build/s1test/${name}.wasm" ] && [ $(wc -c < "_build/s1test/${name}.wasm") -gt 100 ]; then
              run_result=$(wasmtime run -W exceptions=y --invoke run "_build/s1test/${name}.wasm" 2>&1)
              if echo "$run_result" | grep -q "^0$\|^warning"; then
                ok=$((ok + 1))
              else
                fail=$((fail + 1))
                echo "::error::$name: run failed"
              fi
            else
              fail=$((fail + 1))
              echo "::error::$name: compile failed — $(echo "$compile_out" | tail -1)"
            fi
          done
          echo "### Selfhost Examples" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total | $total |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pass | $ok |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fail | $fail |" >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ] || exit 1

      - name: Selfhost runtime fixtures
        if: always()
        run: just test-selfhost-runtime-fixtures || true
