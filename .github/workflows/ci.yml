  # Range mode needs the PR merge base, while compiler-gate itself does not.
  # Keeping the full-history checkout here removes about 50 seconds from the
  # compiler-gate critical path without weakening the fail-closed AST tier.
  review-regressions:
    needs: [compiler-build]
    name: review-regressions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: ./.github/actions/setup-vibe
        with:
          node-version: 24
          wasmtime: 'true'
      - name: Install wasmtime
        # The gates below run compiled sample wasm through the wasmtime
        # binary. It used to be conditioned on the in-job stage2 build being
        # cold; that build now happens once in compiler-build, so the
        # condition is gone and this is unconditional.
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Stage compiler for the AST lint
        run: |
          mkdir -p _build/selfhost/generations/ci-review
          cp _build/_ci_shard_gen/stage2.wasm _build/selfhost/generations/ci-review/stage2.wasm
      - name: Install ripgrep
        run: command -v rg >/dev/null || sudo apt-get install -y ripgrep
      - name: Review-regressions lint (PR range)
        if: github.event_name == 'pull_request'
        env:
          VIBE_REVIEW_LINT_RANGE: ${{ github.event.pull_request.base.sha }}...HEAD
          VIBE_REVIEW_LINT_REQUIRE_AST: "1"
        run: bash scripts/lint_review_regressions.sh
      - name: Guest-profile contract lint
        run: bash scripts/lint_guest_profile_contract.sh

  # Fixture lanes extracted from compiler_gate.sh (#1849 / #2001). Each
  # shard builds its own stage2 from the committed flat module source —
  # the same cache key as unit-tests — so they start at t=0 and do not
  # wait for the bootstrap job's fixpoint. Coverage is fail-closed:
  # ci-required requires this matrix, and an empty/unknown lane fails
  # the dispatcher rather than running nothing.
  compiler-gate-lanes:
    needs: [compiler-build]
    name: compiler-gate (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [early, mid, late]
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Compiler-gate lane ${{ matrix.lane }}
        env:
          COMPILER_GATE_LANE: ${{ matrix.lane }}
          VIBE_STAGE2_WASM: ${{ github.workspace }}/_build/_ci_shard_gen/stage2.wasm
        run: bash scripts/compiler_gate.sh

  # vibe-fmt lint (scripts/check_vibe_fmt.sh): every lib/**/*.vibe and
  # lib/**/*.vpkg file must be a fixpoint of the selfhost formatter unless
  # grandfathered in scripts/vibe_fmt_allowlist.txt (ratchet, mirrors
  # lint-architecture-debt). `.vpkg` goes through format_vpkg (#1435): the
  # package header is not vibe syntax and gets its own canonical writer,
  # the bodyless declarations below it go through the same CST formatter.
  # Needs only node (vibe_fmt.sh drives the committed seed through the node
  # host runner, no wasmtime), so this runs standalone and overlaps
  # compiler-gate/unit-tests instead of serializing behind them.
  vibe-fmt-check:
    name: vibe-fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Generated compiler artifacts (fingerprint)
        # The five generated artifacts are build outputs, not tracked files
        # (scripts/ensure_generated.sh). Their fingerprint is a pure function of
        # (seed, compiler source), so it also keys the stage2 cache below --
        # which is what the committed flat module source used to do via
        # hashFiles.
        id: genfp
        run: echo "fp=$(bash scripts/ensure_generated.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache generated compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            lib/@vibe/compiler/compiler_sources_bundle.vibe
            lib/@vibe/compiler/cli_adapter_bundle.vibe
            lib/@vibe/compiler/selfbuild_runtime_entry_bundle.vibe
            lib/@vibe/compiler/_cli_adapter_module_source.vibe
            lib/@vibe/compiler/cache/codegen_fingerprint.vibe
            lib/@vibe/compiler/.generated.stamp
            lib/@vibe/compiler/.generated.inputs
          key: gen-v1-${{ steps.genfp.outputs.fp }}
      - name: Ensure generated compiler artifacts
        run: bash scripts/ensure_generated.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: vibe-fmt lint
        run: bash scripts/check_vibe_fmt.sh

  # Structural debt ratchet (scripts/lint_architecture_debt.sh). The comment on
  # vibe-fmt-check above calls itself a mirror of this lint, but this one had no
  # CI job at all: it ran only from the local pre-commit hook. #1729 then made
  # that single checkpoint fail on untouched code, and the way past a failing
  # hook is `--no-verify`, which switches the ratchet off for the whole commit.
  # A ratchet whose only enforcement point is bypassable enforces nothing.
  #
  # Needs neither a seed nor a build -- it is ripgrep over the tree plus a
  # baseline file -- so it is a standalone job that overlaps everything else.
  # scripts/lint_review_regressions.sh is intentionally NOT run here: it lints
  # `git diff --cached`, so with nothing staged it would pass vacuously. Its
  # self-test is what carries meaning away from the hook, and that does run.
  structural-lint:
    name: structural-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: command -v rg >/dev/null || sudo apt-get install -y ripgrep
      - name: Cache seed artifact
        # WITHOUT THIS STEP THIS JOB REBUILDS THE SEED FROM SOURCE.
        # bootstrap/seed/compiler.wasm is gitignored, so the first thing that
        # touches the compiler calls ensure_seed.sh -- and when the pinned
        # release tag is not published yet (a bootstrap bump before its
        # `seed-release` run lands), ensure_seed REBUILDS the pinned seed:
        # stage0 -> stage1 -> stage2, ~5 minutes, silently, inside whatever
        # step happened to ask first. Measured on run 34567587111: 304s in
        # "Generated compiler fingerprint" here, 323s in compiler-playground,
        # 335s in compiler-docs and 429s inside structural-lint's
        # review-regressions self-test -- four jobs paying the same 5 minutes
        # for the same artifact. The cache key is the pin, so one run pays it
        # and every later one restores in ~2s.
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: architecture-debt lint self-test
        run: bash scripts/lint_architecture_debt_test.sh
      - name: architecture-debt lint
        run: bash scripts/lint_architecture_debt.sh
      - name: review-regressions lint self-test
        run: bash scripts/lint_review_regressions_test.sh
      - name: compiler-gate registry self-test
        run: bash scripts/check_gate_registry_test.sh
      - name: compiler-gate CI layout self-test
        run: bash scripts/test_ci_compiler_gate_layout.sh
      - name: doc path-citation lint self-test
        run: bash scripts/check_doc_path_citations_test.sh
      - name: doc path-citation lint
        run: bash scripts/check_doc_path_citations.sh
      - name: doc classification lint self-test
        run: bash scripts/check_doc_classification_test.sh
      - name: doc classification lint
        run: bash scripts/check_doc_classification.sh
      - name: task-inputs gate self-test
        run: bash scripts/check_task_inputs_test.sh
      - name: task-inputs gate
        run: bash scripts/check_task_inputs.sh
      - name: doc-commands gate
        run: bash scripts/check_doc_commands.sh
      - name: portable-boundary gate self-test
        run: bash scripts/check_portable_boundary_test.sh
      - name: portable-boundary gate
        run: bash scripts/check_portable_boundary.sh
      - name: pkfire pin gate self-test
        run: bash scripts/check_pkfire_pin_test.sh
      - name: pkfire pin gate
        # Lexical: the action ref, the version input each call site passes, and
        # the session-start hook must all agree with .github/pkfire-version.
        # The ref alone selects nothing -- CI ran pkfire@0.16.0 under a ref
        # that said v0.14.2 (#2645 follow-up).
        run: bash scripts/check_pkfire_pin.sh
      - name: CI seed-cache gate self-test
        run: bash scripts/check_ci_seed_cache_test.sh
      - name: CI seed-cache gate
        # Lexical, no toolchain: every CI job that reaches a repository script
        # restores the pinned seed from cache first. Without it the job silently
        # REBUILDS the seed (~5 min) whenever its release tag is unpublished --
        # which is what four jobs were doing on run 34567587111 (#2645).
        run: bash scripts/check_ci_seed_cache.sh
      - name: gate-wiring gate self-test
        run: bash scripts/check_gate_wiring_test.sh
      - name: gate-wiring gate
        run: bash scripts/check_gate_wiring.sh
      - name: tracked-experiment-names lint self-test
        run: bash scripts/lint_tracked_experiment_names_test.sh
      - name: tracked-experiment-names lint
        run: bash scripts/lint_tracked_experiment_names.sh
      # The self-test already runs above as "compiler-gate registry self-test";
      # only the production check was missing from CI.
      - name: gate-registry check
        run: bash scripts/check_gate_registry.sh
      - name: canonical-iterator-calls check self-test
        run: bash scripts/check_canonical_iterator_calls_test.sh
      - name: canonical-iterator-calls check
        run: bash scripts/check_canonical_iterator_calls.sh
      - name: ast-binary-tags check self-test
        run: bash scripts/check_ast_binary_tags_test.sh
      - name: ast-binary-tags check
        run: bash scripts/check_ast_binary_tags.sh
      - name: lock-clean check self-test
        run: bash scripts/check_lock_clean_test.sh
      - name: lock-clean check
        run: bash scripts/check_lock_clean.sh
      - name: book-order check
        run: bash scripts/check_book_order.sh
      - name: inline-builtin-capture check
        run: bash scripts/check_inline_builtin_capture.sh
      # The #1189 / ADR-0081 naming ratchet, reaching CI for the first time. It
      # is a release-check dep, but release-check has no CI job either, so its
      # one enforcement point was a local sign-off nobody re-runs on a green
      # tree -- and it had been failing on main since #1614, ~300 commits.
      # #2538: the same lesson, one issue later. This guard on
      # `dinsp_scan`'s shape sat red for a week because it was referenced by no
      # pkf task, no gate lane and no CI job. It is now a release-check dep --
      # and, per the note directly above, that is NOT enforcement on its own,
      # so it gets a job here. It reads two source files and runs in ~1s, which
      # is what structural-lint is for.
      - name: normalizer scalar-scan structure guard
        run: node --test tests/normalizer_scalar_scan_compaction_test.mjs
      - name: method-style-naming lint self-test
        run: bash scripts/lint_method_style_naming_test.sh
      - name: method-style-naming lint
        run: bash scripts/lint_method_style_naming.sh
      # ADR-0109: the launcher, the release notes, the roadmap ladder and the
      # stable-surface doc must name ONE version. This one really is pure text
      # -- no seed, no runner -- so structural-lint is its home.
      - name: book-links check self-test
        run: bash scripts/check_book_links_test.sh
      - name: book-links check
        run: bash scripts/check_book_links.sh
      - name: version-ladder check self-test
        run: bash scripts/check_version_ladder_test.sh
      - name: version-ladder check
        run: bash scripts/check_version_ladder.sh
      - name: pre-commit hook self-test
        run: bash scripts/precommit_test.sh
      # #2409: the tree-sitter C parser and the two wasm artifacts built from
      # the same grammar had always been regenerated together, until #2403
      # could rebuild only the C parser (no emscripten there) and the two wasm
      # files went stale -- `~x` stayed a syntax error in the playground and in
      # Zed while the corpus suite was green. The pairing was a habit; this
      # makes it a check. Pure hashing plus a grep over the generated parser,
      # so structural-lint is its home.
      - name: tree-sitter artifact pairing self-test
        run: bash scripts/check_treesitter_artifacts_test.sh
      - name: tree-sitter artifact pairing
        run: bash scripts/check_treesitter_artifacts.sh
      # Hashing pins the three artifacts to each other, not to the grammar: the
      # stamp is a file in the tree, so a parser-only regeneration followed by a
      # restamp makes every hash agree while the wasm is still stale (#2422
      # review reproduced exactly that). This proves the wasm by PARSING the
      # same corpus `tree-sitter test` proves the C parser against, which is not
      # rewritable. Installs the loader version playground/package.json pins.
      - name: tree-sitter wasm corpus self-test
        run: bash scripts/check_treesitter_wasm_corpus_test.sh
      - name: tree-sitter wasm corpus
        run: bash scripts/check_treesitter_wasm_corpus.sh

  # wasm-gc lane gate (#1332). The gc backend's native-array lowering is the
  # one path whose failure mode is a module that does not VALIDATE, and it was
  # invisible to every other job: #1329's work sat un-merged for days because
  # nothing checked it, and #1427's `_start` type mismatch shipped to main for
  # the same reason. scripts/test_gc_heap_accounting.sh is that check.
  #
  # It runs as its OWN parallel job rather than a step inside compiler-gate:
  # it needs two things no other job wants — `wasm-tools` (for independent
  # Wasm-GC validation) and a release `viberun` (for the vibe::mem bump-heap
  # telemetry the allocation assertion reads). Both are installed HERE, so the
  # global setup and the critical path stay untouched. Job wall is ~2 min cold
  # / well under 1 min with both caches warm, against a ~4 min critical path
  # (the smoke matrix), so this adds no bottleneck.
  #
  # Toolchain: node drives the compile (run_wasm_vibe_host_runner.sh is
  # node-only) and viberun embeds wasmtime as a crate, but generations.sh's
  # "validate stageN compiler -> sample" step shells out to a wasmtime BINARY,
  # so the same install the unit-test shards do is required here too. (Dropping
  # it passed locally purely because this dev box had wasmtime on PATH — the
  # first CI run caught it.)
  gc-gate:
    needs: [compiler-build]
    name: gc-gate (${{ matrix.group }})
    # "wasm-gc heap accounting + validation" was 220s of this job's 274s of
    # gate work, with the validator-parity and fixture steps adding ~55s after
    # it. Splitting them puts both under the run's per-job budget instead of
    # summing into one 500s job.
    strategy:
      fail-fast: false
      matrix:
        group: [heap, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Install wasm-tools (this job only)
        # Same pinned version and prebuilt-first/cargo-fallback shape as the
        # wasi-p3 job's toolchain step, kept local to this job so no other
        # job pays for it.
        env:
          WASM_TOOLS_VERSION: "1.253.0"
        run: |
          set -euo pipefail
          mkdir -p "$PWD/gc-tools"
          if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" | tar -xz; then
            cp "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$PWD/gc-tools/"
          else
            cargo install wasm-tools --locked --version "$WASM_TOOLS_VERSION" --root "$PWD/gc-tools-cargo"
            cp "$PWD/gc-tools-cargo/bin/wasm-tools" "$PWD/gc-tools/"
          fi
          echo "$PWD/gc-tools" >> "$GITHUB_PATH"
      - name: Toolchain identity for the viberun cache key
        if: matrix.group == 'heap'
        # THE STAMP INCLUDES rustc, SO THE KEY MUST TOO (Codex review of #2645).
        # ensure_viberun.sh hashes `rustc --version` -- a binary built by a
        # different toolchain is a different binary. But the key was a function
        # of the manifests and sources only, so when ubuntu-latest advances its
        # Rust the exact key still HITS, the restored stamp disagrees, the job
        # rebuilds, and the immutable entry cannot be replaced: the same
        # rebuild-forever trap the v1 -> v2 bump just fixed, recreated by the
        # input I added to fix something else. The toolchain goes in the key.
        id: rustc
        run: echo "id=$(rustc --version | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache viberun build
        # ONLY THE `heap` SHARD (Codex review of #2645). Both shards used to
        # carry this step with the same key, but only `heap` runs
        # test_gc_heap_accounting.sh, which is what calls ensure_viberun.sh and
        # writes .viberun_srchash. `validate` is faster and has a
        # `cargo install wasm-tools` fallback that populates ~/.cargo/registry,
        # so on a cold key its post-job save could win and publish a v3 archive
        # with NO stamp -- immutable, so every later consumer would rebuild
        # forever. A job that writes this cache must be a job that produces the
        # stamp.
        if: matrix.group == 'heap'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/viberun/target
          key: viberun-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('runtime/viberun/Cargo.lock', 'runtime/viberun/Cargo.toml') }}-${{ hashFiles('runtime/viberun/src/**') }}
          restore-keys: |
            viberun-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('runtime/viberun/Cargo.lock', 'runtime/viberun/Cargo.toml') }}-
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
        with:
          stage2-dest: _build/_ci_gc_gen
      - name: wasm-gc heap accounting + validation
        if: matrix.group == 'heap'
        run: bash scripts/test_gc_heap_accounting.sh "$PWD/_build/_ci_gc_gen/stage2.wasm"
      # Runs HERE and not in a gate of its own for the same two reasons the job
      # exists: it needs wasm-tools (its oracle) and a stage2, both of which
      # this job already has. It checks two things about our own output --
      # that @vibex/wasm_parser's validator never rejects what wasm-tools
      # accepts and reads every instruction, and that used_by_codegen() still
      # names every proposal the output requires. Registering the pkf task
      # without this step would leave both measurements running nowhere.
      - name: wasm validator parity + feature-declaration scan
        if: matrix.group == 'validate'
        run: bash scripts/test_wasm_validate_parity.sh "$PWD/_build/_ci_gc_gen/stage2.wasm"
      # #2156 review: until now NOTHING ran a test fixture on the wasm-gc
      # lane in CI. gc-gate built a stage2 and checked heap accounting and
      # validator parity; the gc fixture list lived in
      # scripts/test_gc_selfbuild.sh, which is a manually-run task whose own
      # tail says "Informational tool: report, don't gate". So a gc-lane
      # miscompile could only be caught by someone running that task by hand
      # -- which is how #2158 was fixed on linear, asserted fixed by a linear
      # test, and left live on gc.
      #
      # The list is the same one test_gc_selfbuild.sh runs. Keep them in step;
      # there is no filename-pattern selection, a fixture is gc-covered only by
      # being named here.
      - name: wasm-gc runtime test fixtures
        if: matrix.group == 'validate'
        run: |
          VIBE_TEST_CLI_WASM="$PWD/_build/_ci_gc_gen/stage2.wasm" VIBE_TEST_BACKEND=gc \
            bash scripts/vibe_test.sh \
            fixtures/eq_structural_aggregates_test.vibe \
            fixtures/map_builder_growth_test.vibe \
            fixtures/struct_field_collision_test.vibe \
            fixtures/float_return_to_string_gc_test.vibe \
            fixtures/float_call_offset_gc_lane.vibe \
            fixtures/float_return_review_gc.vibe \
            fixtures/int_bit_primitives_test.vibe \
            fixtures/bytes_alloc_backend_parity_test.vibe \
            fixtures/gc_handle_aggregate_test.vibe \
            fixtures/trait_namespace_operation_test.vibe \
            fixtures/trait_namespace_import_test.vibe \
            fixtures/trait_namespace_inherited_import_test.vibe \
            fixtures/gc_import_resolution_test.vibe \
            fixtures/gc_import_builtin_shadow_test.vibe \
            fixtures/gc_import_call_offset_collision_test.vibe \
            fixtures/constructor_indexed_map_gc_test.vibe \
            fixtures/constructor_indexed_async_iter_gc_test.vibe \
            fixtures/bytes_index_of_bytes_test.vibe \
            fixtures/bytes_index_of_byte_test.vibe \
            fixtures/bytes_count_last_index_of_test.vibe \
            fixtures/bytes_compare_test.vibe
      - name: wasm-gc direct single-file import diagnostic
        if: matrix.group == 'validate'
        run: bash scripts/test_gc_direct_import_diag.sh "$PWD/_build/_ci_gc_gen/stage2.wasm"
      # The fixture harness above is not the public command boundary. Keep a
      # separate regression for runtime/vibe's compile_to environment wiring:
      # VIBE_TEST_BACKEND=gc must retain filesystem module loading (#2376).
      - name: wasm-gc public test import resolution
        if: matrix.group == 'validate'
        run: bash scripts/test_gc_launcher_import.sh "$PWD/_build/_ci_gc_gen/stage2.wasm"

  # The 467-file selfhost unit-test battery (#531/#535), weight-balanced into
  # parallel shards (scripts/unit_test_weights.tsv drives the LPT partition
  # inside unit_test_runner.sh). Each shard builds its own stage2 from the
  # committed flat module source — seed->stage1->stage2 is ~20-30s with the
  # bundle regeneration skipped, and the result is byte-identical to the
  # gate's stage2 (the gate separately verifies the committed flat source is
  # in sync and that the build reaches the stage2==stage3 fixpoint) — so the
  # shards run concurrently with compiler-gate instead of behind it.
  unit-tests:
    needs: [compiler-build]
    name: unit-tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Restore persistent compile cache
        # Content-keyed compiler cache (_build/vibe_selfhost_*, see
        # docs/build-cache.md): every row's key folds in the codegen
        # fingerprint, so entries from an older compiler are simply ignored
        # on lookup — restoring is always safe, and a warm cache shaves
        # ~25% off the per-file compiles when the compiler is unchanged.
        uses: actions/cache@v4
        with:
          path: |
            _build/vibe_selfhost_*
            _build/vibe_unit_out_cache
          key: vibecache-v2-${{ hashFiles('lib/@vibe/compiler/cache/codegen_fingerprint.vibe') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            vibecache-v2-${{ hashFiles('lib/@vibe/compiler/cache/codegen_fingerprint.vibe') }}-shard${{ matrix.shard }}-
      - name: Compiler unit-test runner (shard ${{ matrix.shard }}/8)
        run: |
          VIBE_STAGE2_WASM="$PWD/_build/_ci_shard_gen/stage2.wasm" \
          VIBE_UNIT_TEST_SHARD="${{ matrix.shard }}/8" \
            bash scripts/unit_test_runner.sh

  # Selfhost suite coverage gate (#535), main-only. Re-runs the entire
  # allowlist under function/branch hit instrumentation and enforces the
  # ratcheting minimums (defaults in scripts/coverage_suite.sh; raise them as
  # coverage improves, lowering needs a rationale in the PR). This used to be
  # a step INSIDE compiler-gate, doubling that job's wall time on every main
  # push; as its own job it overlaps everything else and the required path
  # never waits on it. An instrumentation-only miscompile is still caught at
  # most one merge late, never silently for good.
  coverage-suite:
    needs: [compiler-build]
    name: coverage-suite (main only, shard ${{ matrix.shard }})
    # 691s and the longest step in the workflow: it alone set the run's wall
    # clock at 891s while the required path finished at 615s (run
    # 34567587111). It is already parallel inside the job -- vibe_test.sh fans
    # out over min(4, nproc) -- so the only way down is more runners. Eight
    # disjoint partitions of the same battery; the merge job below aggregates
    # them and applies the ratchets, which is where they belong: a shard sees a
    # subset, so every union metric it could compute is a lower bound.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # contents: write for the bench-data append below (same branch the perf
    # workflow snapshots to; different files, so the writers never conflict
    # beyond the push race the retry loop already absorbs).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Selfhost suite coverage shard ${{ matrix.shard }}/8 (#535)
        # Relative path: coverage_suite.sh historically rebased $cli onto the
        # repo root (it now tolerates absolute paths too, but stay canonical).
        run: |
          VIBE_SUITE_CLI_WASM="_build/_ci_shard_gen/stage2.wasm" \
          VIBE_COVERAGE_SHARD="${{ matrix.shard }}/8" \
            bash scripts/coverage_suite.sh
      - name: Stage coverage shard ${{ matrix.shard }}
        # Staged into ONE directory rather than uploading two paths: with two,
        # upload-artifact roots the archive at their common ancestor, so the
        # layout the merge sees depends on where the inputs happen to live.
        # This way the artifact is exactly {vibe_test.log, coverage/} and the
        # merge's glob is a fact about this step, not about that rule.
        run: |
          set -euo pipefail
          out=_build/coverage-shard-out
          rm -rf "$out"
          mkdir -p "$out/coverage"
          cp _build/coverage/selfhost-suite/vibe_test.log "$out/vibe_test.log"
          cp -a _build/vibe_test/coverage/. "$out/coverage/"
      - name: Upload coverage shard ${{ matrix.shard }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          retention-days: 1
          path: _build/coverage-shard-out
          if-no-files-found: error
  coverage-merge:
    name: coverage-suite (merge)
    # The ratchets live here, over the union of all eight shards. No compiler:
    # the report is a pure function of the shard logs and the per-entry
    # coverage JSON, so this is a download plus a python run.
    needs: [coverage-suite]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Cache seed artifact
        # The merge path needs no compiler, but coverage_suite.sh is one script
        # and check_ci_seed_cache.sh judges the job, not the branch taken --
        # deliberately, since no scanner can follow which branch runs.
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Download coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: _build/coverage-shards
      - name: Aggregate and gate (#535)
        # VIBE_COVERAGE_MERGE_EXPECT makes a lost upload fail as a lost upload:
        # a partial merge understates every union metric, and without this it
        # would read as a coverage regression and get "explained" by lowering
        # the ratchet.
        run: |
          VIBE_COVERAGE_MERGE_DIR=_build/coverage-shards \
          VIBE_COVERAGE_MERGE_EXPECT=8 \
            bash scripts/coverage_suite.sh
      - name: Coverage summary (#1556)
        # Put the union rates on the run's summary page so the current value is
        # visible without downloading the artifact or scrolling the log -- the
        # union numbers are the source-coverage ones (each function/branch
        # counted once); the entry-weighted pair is kept for continuity with
        # the older gate and is NOT source coverage.
        if: always()
        run: |
          report=_build/coverage/selfhost-suite/selfhost_suite.report.json
          [ -f "$report" ] || exit 0
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          fu, bu, w = r["function_union"], r["branch_union"], r["entry_weighted"]
          print("### selfhost suite coverage\n")
          print("| metric | hit | total | rate |")
          print("| --- | ---: | ---: | ---: |")
          for name, m in (("branch union", bu), ("function union", fu),
                          ("branch (entry-weighted)", w["branch"]),
                          ("function (entry-weighted)", w["function"])):
              print(f"| {name} | {m['hit']} | {m['total']} | {m['rate']}% |")
          print(f"\ncases {r['entries_passed']}/{r['entries_total']} ({r['case_rate']}%)")
          if not bu["exact"]:
              print("\n> branch union is a LOWER BOUND (some entries reported no branch mask).")
          PY
      - name: Upload compiler suite coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-suite-coverage
          path: _build/coverage/selfhost-suite/selfhost_suite.report.json
          if-no-files-found: ignore
      - name: Append coverage snapshot to bench-data
        # Store the headline union rates on the bench-data branch
        # (coverage_latest.json + data/coverage.jsonl) so every PR's perf
        # report can display the repo's current test coverage — this job is
        # main-only (the suite re-runs the whole battery instrumented), so
        # the perf report labels the numbers as "measured on main", never as
        # the PR's own coverage. Same worktree + retry pattern as perf-metrics'
        # snapshot append; the payload is append-only/last-wins so refetch +
        # reapply + push is always safe.
        run: |
          set -euo pipefail
          report=_build/coverage/selfhost-suite/selfhost_suite.report.json
          [ -f "$report" ] || { echo "no suite report; skipping snapshot"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf _build/bench-data
            if git fetch --depth 1 origin bench-data 2>/dev/null; then
              git worktree add _build/bench-data FETCH_HEAD
            else
              git worktree add --detach _build/bench-data
              (cd _build/bench-data && git checkout --orphan bench-data && git rm -rf --quiet . || true)
            fi
            mkdir -p _build/bench-data/data
            node scripts/coverage_bench_snapshot.mjs "$report" \
              _build/bench-data/coverage_latest.json > _build/coverage_snapshot.json
            cat _build/coverage_snapshot.json | tr -d '\n' >> _build/bench-data/data/coverage.jsonl
            echo >> _build/bench-data/data/coverage.jsonl
            # Latest-pointer guard (Codex P1): two overlapping main pushes can
            # finish out of order — the retry loop absorbs the push race but
            # not snapshot ordering. Replace coverage_latest.json only when
            # this run is not OLDER than the stored one (run_number is
            # monotonic across pushes and preserved on re-runs); a stale run
            # still appends its history row above, it just leaves the latest
            # pointer alone.
            replace_latest="$(node -e '
              const fs = require("fs");
              const cur = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              let stored = null;
              try { stored = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); } catch {}
              const ok = stored?.run_number == null || cur.run_number == null
                || cur.run_number >= stored.run_number;
              console.log(ok ? "yes" : "no");
            ' _build/coverage_snapshot.json _build/bench-data/coverage_latest.json)"
            if [ "$replace_latest" = "yes" ]; then
              cp _build/coverage_snapshot.json _build/bench-data/coverage_latest.json
            else
              echo "::notice::coverage snapshot from an older run (${GITHUB_SHA::9}); history appended, latest pointer left at the newer snapshot"
            fi
            (
              cd _build/bench-data
              git add -A
              git commit -m "coverage: snapshot ${GITHUB_SHA::9}"
            )
            if git -C _build/bench-data push origin HEAD:refs/heads/bench-data; then
              break
            fi
            git worktree remove --force _build/bench-data || true
            [ "$attempt" -lt 3 ] || { echo "::error::failed to push bench-data after 3 attempts"; exit 1; }
            sleep $((attempt * 3))
          done
          git worktree remove --force _build/bench-data || true

  # WASI p3 guarantee (#821): vibe-built async components + the wasi:http p3
  # serve pipeline, plus the optional ratified wasi:cli/stdin availability
  # probe. Missing tools are FAILURES (no silent skip). This job is not folded
  # into ci-required; the stdin probe records explicit host unavailability
  # without turning that expected result into a required CI failure.
  #
  # Single leg, ratified WASI 0.3.0 (#821 cutover, done): the vendored WIT
  # (lib/@vibe/wasi/wit/p3) was refreshed to wasi:http@0.3.0, matching what
  # wasmtime 46+ serves by default (component-model-async on by default
  # too). Both phases pass. A wasmtime 45.x compat leg (phase A / async only
  # -- 45 only ever served the pre-cutover RC world, so it couldn't link
  # phase B / http at all) was dropped once 47 had been the sole target
  # everywhere else in this repo for a while; see git history if 45 compat
  # ever needs re-checking.
  wasi-p3-gate:
    name: wasi-p3-gate (wasmtime v47.0.2)
    needs: [compiler-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-v47.0.2-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.2/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Install wasm-tools / wac
        # Prebuilt release binaries (validated versions; cargo install is the
        # fallback so a renamed asset degrades to a slow build, not a red run).
        env:
          WASM_TOOLS_VERSION: "1.253.0"
          # 0.10.1 verified locally: `wac plug` of the p3 handler + wasmtime
          # serve is green on both 45 and 46. The earlier releases each failed
          # on the wasi:http@0.3 async-lift shape — 0.8.1 with "invalid leading
          # byte (0x43) for component defined type", and 0.9.0 by plugging and
          # validating but failing `wasmtime serve` on a wasi:http/types
          # resource mismatch — so do not downgrade past 0.10.1. Both are fixed
          # upstream; no fork is needed for this shape.
          WAC_VERSION: "0.10.1"
        run: |
          set -euo pipefail
          mkdir -p "$PWD/p3-tools"
          if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" | tar -xz; then
            cp "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$PWD/p3-tools/"
          else
            cargo install wasm-tools --locked --version "$WASM_TOOLS_VERSION" --root "$PWD/p3-tools-cargo"
            cp "$PWD/p3-tools-cargo/bin/wasm-tools" "$PWD/p3-tools/"
          fi
          if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o "$PWD/p3-tools/wac" "https://github.com/bytecodealliance/wac/releases/download/v${WAC_VERSION}/wac-cli-x86_64-unknown-linux-musl"; then
            chmod +x "$PWD/p3-tools/wac"
          else
            cargo install wac-cli --locked --root "$PWD/p3-tools-cargo"
            cp "$PWD/p3-tools-cargo/bin/wac" "$PWD/p3-tools/"
          fi
          echo "$PWD/p3-tools" >> "$GITHUB_PATH"
      - name: Add wasm32 target for the http adapter
        run: rustup target add wasm32-unknown-unknown
      # Phase C compiles a harness that IMPORTS `@vibe/compiler/...`, unlike
      # phases A/B which only drive the compiler as a black box over plain
      # .vibe inputs. That package's closure includes the five generated
      # artifacts (gitignored build outputs), so without these steps the
      # harness compile fails on `lib/@vibe/compiler/cache/index.vpkg:
      # contract violation: contract declaration 'codegen_fingerprint' has no
      # implementation`. ensure_generated.sh needs the seed, hence both.
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
        with:
          # Three env vars below address the compiler at this path.
          stage2-dest: _build/ci-artifacts
      - name: WASI p3 guarantee gate
        env:
          VIBE_P3_GATE_REQUIRE_TOOLS: "1"
          VIBE_P3_GATE_PHASES: "async,http,stdin"
          VIBE_ASYNC_GATE_COMPILER: ${{ github.workspace }}/_build/ci-artifacts/stage2.wasm
          VIBE_SERVE_CLI_WASM: ${{ github.workspace }}/_build/ci-artifacts/stage2.wasm
          # This job builds nothing: it has no generations tree and no seed
          # (it never runs ensure_seed.sh), so phase C's shadow-component gate
          # has to be pointed at the downloaded stage2 like the other two.
          VIBE_STDIN_PROVIDER_GATE_COMPILER: ${{ github.workspace }}/_build/ci-artifacts/stage2.wasm
        run: bash scripts/test_wasi_p3_guarantee_gate.sh

  # Continuous performance tracking (bench/perf/README.md "Continuous perf
  # tracking"): a sticky "📊 Perf report" comment on every PR comparing its
  # metrics against the latest main snapshot, and a snapshot appended to the
  # `bench-data` branch on every main push. Advisory only: not in
  # ci-required, never blocks a merge (the blocking allocation gate is the
  # KPI heap step in compiler-stage2-oracles).
  #
  # This job used to be its own workflow (perf.yml). Measured on PR #2456
  # (run 33632520247, a compiler-source push, so every cache missed): 8.75
  # min, of which 3.5 min regenerated the compiler artifacts and 2.6 min
  # built stage2 -- the same two products compiler-gate builds in the same
  # run -- and the metrics themselves took 47 s. It now downloads
  # compiler-gate's artifacts instead, which serializes it behind that job;
  # the t=0 rule above is for the REQUIRED path, and this job, like
  # wasi-p3-gate, is not on it.
  perf-metrics:
    name: perf-metrics
    needs: [compiler-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        # bench_metrics.sh benches one fixed series against the committed
        # seed as its runner-speed calibration reading.
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # See cli-install.yml's "Cache cargo + runner build" step for why this
      # is Swatinem/rust-cache rather than a raw actions/cache path list: a
      # plain restore keeps archived mtimes older than the fresh checkout's,
      # so cargo re-fingerprints (and recompiles) the whole dependency tree
      # even on a cache hit.
      - name: Toolchain identity for the viberun cache key
        # THE STAMP INCLUDES rustc, SO THE KEY MUST TOO (Codex review of #2645).
        # ensure_viberun.sh hashes `rustc --version` -- a binary built by a
        # different toolchain is a different binary. But the key was a function
        # of the manifests and sources only, so when ubuntu-latest advances its
        # Rust the exact key still HITS, the restored stamp disagrees, the job
        # rebuilds, and the immutable entry cannot be replaced: the same
        # rebuild-forever trap the v1 -> v2 bump just fixed, recreated by the
        # input I added to fix something else. The toolchain goes in the key.
        id: rustc
        run: echo "id=$(rustc --version | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache viberun build
        # install/install.sh builds runtime/viberun with `cargo build --release`
        # unless target/release/viberun already exists. Uncached that is the
        # whole step: on run 34567587111 this job spent ~215s there and printed
        # nothing, while the check it exists for took 23s. The key is
        # Cargo.lock + src, which does not move when the compiler changes, so
        # unlike the compiler caches this one actually hits.
        #
        # actions/cache over target/, not Swatinem/rust-cache: rust-cache
        # deliberately drops the workspace crate's own artifacts and keeps only
        # dependencies, so the binary is relinked every run -- which is why
        # perf-metrics still paid 104s with a cache step in place.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/viberun/target
          key: viberun-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('runtime/viberun/Cargo.lock', 'runtime/viberun/Cargo.toml') }}-${{ hashFiles('runtime/viberun/src/**') }}
          restore-keys: |
            viberun-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('runtime/viberun/Cargo.lock', 'runtime/viberun/Cargo.toml') }}-
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Build viberun (micro-bench runtime)
        # Same reason as the two gate jobs above: cargo alone rebuilds every
        # run because checkout moves the source mtimes.
        run: bash scripts/ensure_viberun.sh
      - name: Collect metrics
        run: |
          bash scripts/bench_metrics.sh _build/_ci_shard_gen/stage2.wasm _build/bench_metrics.json
          cat _build/bench_metrics.json
      - name: Fetch baseline from bench-data branch
        # latest.json = perf baseline (last main perf snapshot);
        # coverage_latest.json = last main coverage-suite run (the
        # coverage-suite job above appends it -- main-only, so the report
        # labels it "measured on main", never as this PR's own coverage).
        run: |
          # `git show > file` leaves a 0-byte file when the object is missing
          # (e.g. no coverage snapshot recorded yet) -- remove the husk so the
          # renderer sees "absent", not "empty JSON".
          if git fetch --depth 1 origin bench-data 2>/dev/null; then
            git show FETCH_HEAD:latest.json > _build/bench_baseline.json 2>/dev/null || rm -f _build/bench_baseline.json
            git show FETCH_HEAD:coverage_latest.json > _build/coverage_latest.json 2>/dev/null || rm -f _build/coverage_latest.json
          fi
          ls -la _build/bench_baseline.json 2>/dev/null || echo "no baseline yet"
          ls -la _build/coverage_latest.json 2>/dev/null || echo "no coverage snapshot yet"
      - name: Render report
        run: |
          node scripts/bench_report.mjs _build/bench_metrics.json _build/bench_baseline.json \
            _build/coverage_latest.json > _build/bench_report.md
          cat _build/bench_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_build/bench_report.md', 'utf8');
            const marker = '<!-- vibe-perf-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Append snapshot to bench-data branch (main only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry loop: concurrent main pushes race on the data branch; the
          # payload is append-only so refetch + reapply + push is always safe.
          for attempt in 1 2 3; do
            rm -rf _build/bench-data
            if git fetch --depth 1 origin bench-data 2>/dev/null; then
              git worktree add _build/bench-data FETCH_HEAD
            else
              git worktree add --detach _build/bench-data
              (cd _build/bench-data && git checkout --orphan bench-data && git rm -rf --quiet . || true)
            fi
            mkdir -p _build/bench-data/data
            cat _build/bench_metrics.json | tr -d '\n' >> _build/bench-data/data/main.jsonl
            echo >> _build/bench-data/data/main.jsonl
            cp _build/bench_metrics.json _build/bench-data/latest.json
            (
              cd _build/bench-data
              git add -A
              git commit -m "perf: snapshot ${GITHUB_SHA::9}"
            )
            if git -C _build/bench-data push origin HEAD:refs/heads/bench-data; then
              break
            fi
            git worktree remove --force _build/bench-data || true
            [ "$attempt" -lt 3 ] || { echo "::error::failed to push bench-data after 3 attempts"; exit 1; }
            sleep $((attempt * 3))
          done
          git worktree remove --force _build/bench-data || true
      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-metrics
          path: |
            _build/bench_metrics.json
            _build/bench_report.md

  # Aggregate required check (branch protection requires "ci-required").
  ci-required:
    name: ci-required
    needs: [compiler-build, compiler-gate, compiler-gate-preflight, compiler-stage2-oracles, compiler-docs, compiler-contracts, compiler-playground, compiler-examples, review-regressions, compiler-gate-lanes, unit-tests, vibe-fmt-check, gc-gate, structural-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.compiler-build.result }}" != "success" ]; then
            echo "::error::compiler-build did not succeed (${{ needs.compiler-build.result }}) -- every job that consumes the shared compiler was skipped"
            exit 1
          fi
          if [ "${{ needs.compiler-gate.result }}" != "success" ]; then
            echo "::error::compiler-gate did not succeed (${{ needs.compiler-gate.result }})"
            exit 1
          fi
          if [ "${{ needs.compiler-gate-preflight.result }}" != "success" ]; then
            echo "::error::compiler-gate-preflight did not succeed (${{ needs.compiler-gate-preflight.result }})"
            exit 1
          fi
          if [ "${{ needs.compiler-stage2-oracles.result }}" != "success" ]; then
            echo "::error::compiler-stage2-oracles did not succeed (${{ needs.compiler-stage2-oracles.result }})"
            exit 1
          fi
          if [ "${{ needs.compiler-docs.result }}" != "success" ]; then
            echo "::error::compiler-docs did not succeed (${{ needs.compiler-docs.result }})"
            exit 1
          fi
          if [ "${{ needs.compiler-contracts.result }}" != "success" ]; then
            echo "::error::compiler-contracts did not succeed (${{ needs.compiler-contracts.result }})"
            exit 1
          fi
          if [ "${{ needs.compiler-playground.result }}" != "success" ]; then
            echo "::error::compiler-playground did not succeed (${{ needs.compiler-playground.result }})"
            exit 1
          fi
          if [ "${{ needs.compiler-examples.result }}" != "success" ]; then
            echo "::error::compiler-examples did not succeed (${{ needs.compiler-examples.result }})"
            exit 1
          fi
          if [ "${{ needs.review-regressions.result }}" != "success" ] && [ "${{ needs.review-regressions.result }}" != "skipped" ]; then
            echo "::error::review-regressions did not succeed (${{ needs.review-regressions.result }})"
            exit 1
          fi
          if [ "${{ needs.compiler-gate-lanes.result }}" != "success" ]; then
            echo "::error::compiler-gate-lanes did not succeed (${{ needs.compiler-gate-lanes.result }})"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::unit-tests did not succeed (${{ needs.unit-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.vibe-fmt-check.result }}" != "success" ]; then
            echo "::error::vibe-fmt-check did not succeed (${{ needs.vibe-fmt-check.result }})"
            exit 1
          fi
          if [ "${{ needs.gc-gate.result }}" != "success" ]; then
            echo "::error::gc-gate did not succeed (${{ needs.gc-gate.result }})"
            exit 1
          fi
          if [ "${{ needs.structural-lint.result }}" != "success" ]; then
            echo "::error::structural-lint did not succeed (${{ needs.structural-lint.result }})"
            exit 1
          fi
          echo "all required jobs passed"
