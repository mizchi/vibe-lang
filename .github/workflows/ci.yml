name: CI

on:
  push:
    branches:
      - main
  pull_request:

# vibe is selfhost-only (the MoonBit host src/ was retired in #594). CI runs the
# selfhost-only gate: bundle/module-source sync + seed->stage1->stage2
# ->stage3 selfbuild with the stage2==stage3 fixpoint and per-stage compile/run
# validation. No MoonBit toolchain is installed or used.
#
# Wall-time layout (#1849 / #2001: compiler_gate.sh is a thin aggregator):
#   - compiler-gate           selfbuild + fixpoint + short stage2 consumers
#   - compiler-gate-preflight stage-independent bootstrap checks
#   - compiler-examples       examples ratchet against a cached stage2
#   - review-regressions      full-history PR lint against a cached stage2
#   - compiler-gate-lanes     early/mid/late fixture lanes; each shard
#                             self-builds stage2 from the committed flat
#                             module source (cached, same as unit-tests)
#                             so they start at t=0
#   - unit-tests 0..3         weight-balanced shards of the unit battery
#   - coverage-suite          main-only, its own job
#   - wasi-p3-gate            needs compiler-gate's stage2 artifact
#   - perf-metrics            advisory perf report; needs compiler-gate's
#                             stage2 + generated artifacts (was perf.yml)
# All jobs start at t=0; nothing on the required path serializes behind
# another job.
jobs:
  compiler-build:
    name: compiler-build
    # THE COMPILER IS BUILT ONCE PER RUN, HERE.
    #
    # Before #2645 fourteen jobs each ran ensure_generated.sh (~100-145s of
    # flatten) and nine of them also ran generations.sh (~66-91s of
    # seed -> stage1 -> stage2) -- the same two artifacts, from the same
    # commit, fourteen times over, ~2700s of runner time per run. It did not
    # buy wall time either: a consumer's download costs ~25s against a
    # producer that finishes in ~200s, which is what the in-job build cost
    # anyway. What it buys is that a SHARD is now cheap: adding a matrix entry
    # costs a job start plus a download, not another compiler build, so the
    # long gates below can be split until each one fits the run's budget.
    #
    # compiler-gate deliberately does NOT consume this. It is the seed ->
    # stage3 fixpoint: it has to perform the build it is checking, and making
    # it wait for a build it would redo anyway would put ~200s in front of it
    # for nothing.
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.genfp.outputs.fp }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vibe
        with:
          node-version: 24
          wasmtime: 'true'
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Generated compiler artifacts (fingerprint)
        id: genfp
        run: echo "fp=$(bash scripts/ensure_generated.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache generated compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            lib/@vibe/compiler/compiler_sources_bundle.vibe
            lib/@vibe/compiler/cli_adapter_bundle.vibe
            lib/@vibe/compiler/selfbuild_runtime_entry_bundle.vibe
            lib/@vibe/compiler/_cli_adapter_module_source.vibe
            lib/@vibe/compiler/cache/codegen_fingerprint.vibe
            lib/@vibe/compiler/.generated.stamp
            lib/@vibe/compiler/.generated.inputs
          key: gen-v1-${{ steps.genfp.outputs.fp }}
      - name: Ensure generated compiler artifacts
        run: bash scripts/ensure_generated.sh
      - name: Cache stage2 (keyed on seed + flat module source)
        id: stage2-cache
        uses: actions/cache@v4
        with:
          path: _build/_ci_shard_gen
          key: stage2-v2-${{ steps.genfp.outputs.fp }}-${{ hashFiles('scripts/generations.sh', 'scripts/wasm_vibe_host_runner.js') }}
      - name: Build stage2 from committed flat module source
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: |
          VIBE_PREBUILT_MODULE_SOURCE=lib/@vibe/compiler/_cli_adapter_module_source.vibe \
            bash scripts/generations.sh build --out-dir _build/_ci_shard_gen
      - name: Assert stage2 exists
        # A missing stage2 has to fail HERE, named, rather than downstream in
        # every consumer at once with the producer reported green.
        run: |
          set -euo pipefail
          if [ ! -s _build/_ci_shard_gen/stage2.wasm ]; then
            echo "::error::compiler-build produced no _build/_ci_shard_gen/stage2.wasm" >&2
            exit 1
          fi
          ls -l _build/_ci_shard_gen/stage2.wasm
      - name: Upload compiler build
        uses: actions/upload-artifact@v4
        with:
          name: compiler-build
          # The WHOLE _build/_ci_shard_gen directory, not just stage2.wasm:
          # generations.sh leaves side products there that consumers read by
          # position. experimental_typing_env_reuse_oracle.mjs opens
          # `dirname(stage2)/cli_adapter_module_source.vibe` and died with
          # ENOENT on run 34577224982 when only the wasm was shipped. Picking
          # files by hand means re-deciding that list every time a consumer
          # grows; shipping the directory makes the consumer's tree identical
          # to the producer's, which is the property they actually depend on.
          # It is ~16 MB.
          #
          # .generated.stamp is what makes ensure_generated a no-op in the
          # consumers; without it every one of them regenerates.
          include-hidden-files: true
          retention-days: 1
          path: |
            _build/_ci_shard_gen
            lib/@vibe/compiler/compiler_sources_bundle.vibe
            lib/@vibe/compiler/cli_adapter_bundle.vibe
            lib/@vibe/compiler/selfbuild_runtime_entry_bundle.vibe
            lib/@vibe/compiler/_cli_adapter_module_source.vibe
            lib/@vibe/compiler/cache/codegen_fingerprint.vibe
            lib/@vibe/compiler/.generated.stamp
            lib/@vibe/compiler/.generated.inputs
          if-no-files-found: error

  compiler-gate-preflight:
    name: compiler-gate (preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vibe
        with:
          node-version: 24
          pkfire: 'true'
          pkfire-cache: 'true'
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Generated compiler artifacts (fingerprint)
        id: genfp
        run: echo "fp=$(bash scripts/ensure_generated.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache generated compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            lib/@vibe/compiler/compiler_sources_bundle.vibe
            lib/@vibe/compiler/cli_adapter_bundle.vibe
            lib/@vibe/compiler/selfbuild_runtime_entry_bundle.vibe
            lib/@vibe/compiler/_cli_adapter_module_source.vibe
            lib/@vibe/compiler/cache/codegen_fingerprint.vibe
            lib/@vibe/compiler/.generated.stamp
            lib/@vibe/compiler/.generated.inputs
          key: gen-v1-${{ steps.genfp.outputs.fp }}
      - name: Ensure generated compiler artifacts
        run: bash scripts/ensure_generated.sh
      - name: Bootstrap preflight
        run: pkf run ci-compiler-gate-preflight

  compiler-gate:
    name: compiler-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        # bootstrap/seed/compiler.wasm is a local build cache (gitignored,
        # not git-tracked) — fetch it from its pinned release tag if the
        # actions/cache step above didn't already restore it.
        run: bash scripts/ensure_seed.sh
      - name: Generated compiler artifacts (fingerprint)
        # The five generated artifacts are build outputs, not tracked files
        # (scripts/ensure_generated.sh). Their fingerprint is a pure function of
        # (seed, compiler source), so it also keys the stage2 cache below --
        # which is what the committed flat module source used to do via
        # hashFiles.
        id: genfp
        run: echo "fp=$(bash scripts/ensure_generated.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache generated compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            lib/@vibe/compiler/compiler_sources_bundle.vibe
            lib/@vibe/compiler/cli_adapter_bundle.vibe
            lib/@vibe/compiler/selfbuild_runtime_entry_bundle.vibe
            lib/@vibe/compiler/_cli_adapter_module_source.vibe
            lib/@vibe/compiler/cache/codegen_fingerprint.vibe
            lib/@vibe/compiler/.generated.stamp
            lib/@vibe/compiler/.generated.inputs
          key: gen-v1-${{ steps.genfp.outputs.fp }}
      - name: Ensure generated compiler artifacts
        run: bash scripts/ensure_generated.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        # The gate runs compiled sample wasm via wasmtime (exceptions/exnref).
        # Pinned to match the toolchain the seed/runner are validated against.
        # Ratified wasi:http@0.3.0 cutover (#821): bumped 45.x -> 46.0.1.
        # 0.4.0 threads prep: bumped 46.0.1 -> 47.0.2 (-S threads removed
        # upstream; repo never used it — active gates are -W side only).
        env:
          WASMTIME_VERSION: v47.0.2
        # `--retry`/`--fail` are not decoration. Without them a single reset on
        # the release download fails a REQUIRED job for a reason that has
        # nothing to do with the change under test -- seen on #2112:
        #   curl: (35) Recv failure: Connection reset by peer
        #   xz: (stdin): File format not recognized
        # `--fail` is what keeps the second line from happening at all: bare
        # curl pipes an HTTP error body into tar, so a 5xx is reported as a
        # corrupt archive. Every wasmtime/wasm-tools/wac fetch in this
        # repository's workflows carries the same flags.
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Install wasm-tools
        # test_cli_core.sh validates every generated core module independently.
        # Keep this pinned to the same version used by the gc and wasi-p3 jobs.
        env:
          WASM_TOOLS_VERSION: "1.253.0"
        run: |
          set -euo pipefail
          mkdir -p "$PWD/compiler-tools"
          if curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" | tar -xz; then
            cp "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$PWD/compiler-tools/"
          else
            cargo install wasm-tools --locked --version "$WASM_TOOLS_VERSION" --root "$PWD/compiler-tools-cargo"
            cp "$PWD/compiler-tools-cargo/bin/wasm-tools" "$PWD/compiler-tools/"
          fi
          echo "$PWD/compiler-tools" >> "$GITHUB_PATH"
      - name: Compiler gate (bootstrap + fixpoint)
        # Fixture lanes run as compiler-gate-lanes (matrix) so they do not
        # sit on this job's critical path. This job keeps the seed->stage3
        # fixpoint, the incremental oracles that consume the just-built
        # generation, and the docs/KPI steps below.
        env:
          COMPILER_GATE_LANE: bootstrap
          COMPILER_GATE_SKIP_PREFLIGHT: "1"
          COMPILER_GATE_SKIP_STAGE2_ORACLES: "1"
        run: bash scripts/compiler_gate.sh

  compiler-stage2-oracles:
    needs: [compiler-build]
    name: compiler-gate (stage2 oracles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vibe
        with:
          node-version: 24
          wasmtime: 'true'
      - name: Cache seed artifact
        # WITHOUT THIS STEP THIS JOB REBUILDS THE SEED FROM SOURCE.
        # bootstrap/seed/compiler.wasm is gitignored, so the first thing that
        # touches the compiler calls ensure_seed.sh -- and when the pinned
        # release tag is not published yet (a bootstrap bump before its
        # `seed-release` run lands), ensure_seed REBUILDS the pinned seed:
        # stage0 -> stage1 -> stage2, ~5 minutes, silently, inside whatever
        # step happened to ask first. Measured on run 34567587111: 304s in
        # "Generated compiler fingerprint" here, 323s in compiler-playground,
        # 335s in compiler-docs and 429s inside structural-lint's
        # review-regressions self-test -- four jobs paying the same 5 minutes
        # for the same artifact. The cache key is the pin, so one run pays it
        # and every later one restores in ~2s.
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Install wasmtime
        # #2184: must run BEFORE "Build stage2 on cache miss" -- the build's
        # validate step shells out to the wasmtime binary. Later steps (the
        # oracles, KPI, size ratchet) need it too, so it stays unconditional.
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Install wasm-tools
        env:
          WASM_TOOLS_VERSION: "1.253.0"
        run: |
          mkdir -p "$PWD/compiler-tools"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" | tar -xz
          cp "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$PWD/compiler-tools/"
          echo "$PWD/compiler-tools" >> "$GITHUB_PATH"
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Stage cached compiler
        run: |
          mkdir -p _build/selfhost/generations/ci-oracles
          cp _build/_ci_shard_gen/stage2.wasm _build/selfhost/generations/ci-oracles/stage2.wasm
      - name: Stage2 consumer oracles
        run: bash tests/gates/bootstrap/stage2_oracles.sh "$PWD/_build/_ci_shard_gen/stage2.wasm"
      - name: Upload incremental shadow decision diff (#1548)
        # compiler_gate.sh step 3aa writes the shadow planner vs current
        # compiler decision diff (only after a successful oracle run).
        # Uploading it keeps the conservative over-invalidation residual
        # observable per run — "permitted but visible" (docs/incremental-
        # build.md Roadmap invariants) — without promoting any observation
        # into a production cache key or reuse decision.
        uses: actions/upload-artifact@v4
        with:
          name: incremental-shadow-decision-diff
          path: _build/ci-artifacts/incremental-shadow-decision-diff.json
          if-no-files-found: error
      - name: Selfcompile KPI heap gate (#987)
        # One real compile through the gate's freshly-built stage2, gated on
        # the linear backend's bump-allocator high-water (heap_ptr_bytes).
        # Unlike wall time it is byte-deterministic for a fixed (stage2,
        # input) pair — scripts/selfcompile_kpi.sh isolates the build cache —
        # so it can block CI without flakes. Threshold = committed baseline
        # + 10%; the baseline tracks the compiler itself, so rebaseline it
        # alongside intentional allocation changes (procedure in
        # bench/perf/heap_baseline.txt).
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          baseline="$(grep -vE '^\s*(#|$)' bench/perf/heap_baseline.txt | head -1)"
          export VIBE_KPI_MAX_HEAP_BYTES=$(( baseline * 110 / 100 ))
          echo "baseline=$baseline gate_max=$VIBE_KPI_MAX_HEAP_BYTES (+10%)"
          bash scripts/selfcompile_kpi.sh "${gen}stage2.wasm"
      - name: Compiler output size ratchet (#1109-4)
        # The sizes the compiler PRODUCES for bench/binary_size/*.vibe,
        # gated per-sample at baseline +2%. Byte-deterministic for a fixed
        # (stage2, sample) pair, so it blocks without flakes. This protects
        # the #1107 Phase 1-4 codegen wins (release strip, funcref table
        # minimization) that the perf report only observed. The compiler's
        # OWN artifact sizes are deliberately NOT gated -- they grow with
        # every feature; see bench/perf/size_baseline.txt's header.
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          bash scripts/size_ratchet.sh "${gen}stage2.wasm"
      - name: vibe normalize smoke test (#882)
        # compiler_gate.sh's "normalize compile+run regression" section
        # exercises the normalize ENGINE directly (VIBE_NORMALIZE=1 against
        # the freshly-built stage2) but never through the seed-driven
        # scripts/vibe_normalize.sh protocol that scripts/vibe_normalize_smoke.sh
        # (Taskfile testVibeNormalizeSmoke) actually drives. Wire the smoke
        # test in here too so that path is gated (it was previously defined
        # but never invoked by any workflow).
        run: bash scripts/vibe_normalize_smoke.sh

  compiler-docs:
    needs: [compiler-build]
    name: compiler-gate (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vibe
        with:
          node-version: 24
          wasmtime: 'true'
      - name: Cache seed artifact
        # WITHOUT THIS STEP THIS JOB REBUILDS THE SEED FROM SOURCE.
        # bootstrap/seed/compiler.wasm is gitignored, so the first thing that
        # touches the compiler calls ensure_seed.sh -- and when the pinned
        # release tag is not published yet (a bootstrap bump before its
        # `seed-release` run lands), ensure_seed REBUILDS the pinned seed:
        # stage0 -> stage1 -> stage2, ~5 minutes, silently, inside whatever
        # step happened to ask first. Measured on run 34567587111: 304s in
        # "Generated compiler fingerprint" here, 323s in compiler-playground,
        # 335s in compiler-docs and 429s inside structural-lint's
        # review-regressions self-test -- four jobs paying the same 5 minutes
        # for the same artifact. The cache key is the pin, so one run pays it
        # and every later one restores in ~2s.
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Install wasmtime
        # The gates below run compiled sample wasm through the wasmtime
        # binary. It used to be conditioned on the in-job stage2 build being
        # cold; that build now happens once in compiler-build, so the
        # condition is gone and this is unconditional.
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Stage cached compiler
        run: |
          mkdir -p _build/selfhost/generations/ci-docs
          cp _build/_ci_shard_gen/stage2.wasm _build/selfhost/generations/ci-docs/stage2.wasm
      - name: Tutorial executable-docs check (#1142)
        # book/**/*.vibe.md's ```vibe run blocks are compiled and run
        # against the freshly-built stage2 and their embedded ```output must
        # still match -- keeps a compiler change or a stale doc edit from
        # passing every other required gate unnoticed (this was a required-
        # check gap noted in #1154's review).
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          VIBE_MD_COMPILER="${gen}stage2.wasm" VIBE_MD_STAGE2="${gen}stage2.wasm" \
            bash scripts/vibe_md.sh check book/en/*.vibe.md book/ja/*.vibe.md
      - name: Tutorial translation parity
        # The step above proves each chapter on its own, which is blind to the
        # English/`-ja` pair: a code change ported to one copy and not the
        # other passes it twice over. This compares the pair's ```output
        # blocks, so the drift shows up here instead of in a reader's editor.
        run: bash scripts/check_tutorial_translation_parity.sh
      - name: Docs doctest (```vibe blocks)
        # Compiles every ```vibe block in README.md, the cheatsheet, vibe.md and
        # the language tour against the freshly-built stage2. This step exists
        # because its absence had a measured cost: the doctest task was defined
        # but wired into nothing, so when #1429 removed the braced effect row
        # and #1461 retired `Error` as a row spelling, only lib/** was migrated
        # and the docs kept the dead syntax. Nothing noticed until the seed bump
        # to console-exception-rowvar-2026-08-06 moved the seed past the removal
        # and 12 doc blocks, examples/, bench/, the playground presets and
        # `vibe new`'s scaffold all broke at once (#1497).
        #
        # DOCTEST_REQUIRE_STAGE2=1 is the load-bearing part: the harness would
        # otherwise fall back to the committed seed, which is the PREVIOUS
        # bootstrap tag and still accepts syntax the current compiler rejects.
        # A seed-driven doctest is exactly the blind spot this step closes, so
        # it must fail rather than silently pass on the seed.
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          DOCTEST_REQUIRE_STAGE2=1 DOCTEST_STAGE2="${gen}stage2.wasm" \
            bash scripts/doctest_extract_run.sh README.md docs/cheatsheet.md docs/vibe.md docs/spec/*.md
      - name: 1.0 freeze-surface check + self-test
        # docs/spec/1.0-freeze.md is the only page that makes a SemVer promise,
        # and it had frozen two names that no longer resolve --
        # `Result::and_then` (the type went in #1324) and the `Iterator::*`
        # combinator layer (retired by ADR-0099). Nothing read the list back.
        #
        # This lives HERE and not in structural-lint because both steps need a
        # compiler: the check probes each frozen name, and the self-test drives
        # the real check against synthetic documents. A first attempt put them
        # in the pure-shell job, where every probe failed with "runner not
        # found" -- the check's own calibration caught that and failed loudly
        # rather than reporting a green run, which is the behaviour being
        # relied on here.
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          FREEZE_STAGE2="${gen}stage2.wasm" bash scripts/check_freeze_surface_test.sh
          FREEZE_STAGE2="${gen}stage2.wasm" bash scripts/check_freeze_surface.sh

  compiler-contracts:
    needs: [compiler-build]
    name: compiler-gate (contracts ${{ matrix.group }})
    # Ten independent contract gates used to run one after another in a single
    # job: 357s of the job's 608s on run 34567587111, with the two heaviest
    # (off-build typecheck 168s, compile-only lanes 142s) contributing most of
    # it. They share nothing but the stage2 they are all pointed at, and that
    # now arrives as an artifact, so a group costs a job start plus a download
    # rather than another compiler build.
    strategy:
      fail-fast: false
      matrix:
        group: [core, compile-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vibe
        with:
          node-version: 24
          wasmtime: 'true'
      # The fingerprint step below is not seed-free: compute_fingerprint hashes
      # bootstrap/seed/compiler.wasm and runs ensure_seed.sh unconditionally to
      # get it, deliberately, so the value does not depend on whether the seed
      # happened to be fetched yet. Without this cache that download runs on
      # every clean runner -- including when the generated artifacts and stage2
      # are both cache HITS and nothing else in the job needs the seed -- which
      # puts a required job behind a release fetch it does not otherwise need.
      # Same pair every other generation job uses.
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: RC-is-default gate
        if: matrix.group == 'core'
        run: RC_DEFAULT_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_rc_default.sh
      - name: Source-range contract gate
        if: matrix.group == 'core'
        run: RANGE_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_source_range_contract.sh
      - name: Cheatsheet-signatures gate
        if: matrix.group == 'core'
        run: CHEATSHEET_SIG_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_cheatsheet_signatures.sh
      - name: Builtin-shadowing gate
        if: matrix.group == 'core'
        run: BUILTIN_SHADOW_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_builtin_shadowing.sh
      - name: Builtin-shadowing gate self-test
        if: matrix.group == 'core'
        run: BUILTIN_SHADOW_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_builtin_shadowing_test.sh
      - name: Package sibling-scope gate
        if: matrix.group == 'core'
        run: SIBLING_SCOPE_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_package_sibling_scope.sh
      - name: Declaration-scale gate
        if: matrix.group == 'core'
        run: DECL_SCALE_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_declaration_scale.sh
      - name: CLI line-termination gate
        if: matrix.group == 'core'
        run: CLI_NL_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_cli_line_termination.sh
      - name: Off-build typecheck gate
        # STAYS IN `core`, BEHIND THE GATES ABOVE. Measured: this gate compiles
        # lib/@vibe/cli/dispatch.vibe, whose import closure needs a warm
        # source-fingerprinted header cache -- the same effect
        # tests/gates/bootstrap/stage2_oracles.sh documents for the CLI core
        # ("header discovery for this import graph retains about 1.03 GB and
        # the cold RC path traps before codegen"). On main the eight contract
        # gates above it happened to warm that cache first. Given its own
        # runner it ran cold and trapped with `RuntimeError: memory access out
        # of bounds` on runs 34577224982 and 34578340183, and reproduces
        # locally the moment _build/vibe_selfhost_* is removed -- exactly one
        # failure, that file. VIBE_WASM_PRE_GROW_PAGES=65000 does not fix it.
        #
        # So the ordering that works is kept rather than rediscovered. The
        # dependency is real and belongs to the gate, not to this file: making
        # it survive a cold cache on its own is its own change.
        if: matrix.group == 'core'
        run: VIBE_OFFBUILD_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_offbuild_typecheck.sh
      - name: Book skip-block gate
        if: matrix.group == 'core'
        run: VIBE_SKIP_BLOCK_CLI_WASM="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_book_skip_blocks.sh
      # No examples typecheck here: check_examples_typecheck.sh was ALREADY
      # wired, via `pkf run ci-check-examples-typecheck` in compiler-examples,
      # against this same stage2 path. It was the one entry my by-hand audit
      # got wrong -- the reachability trace missed the task indirection. Nine
      # of the ten gates in this job were genuinely unrun; this one was not.
      - name: Compile-only lanes gate
        if: matrix.group == 'compile-only'
        run: COMPILE_ONLY_STAGE2="$PWD/_build/_ci_shard_gen/stage2.wasm" bash scripts/check_compile_only_lanes.sh

  compiler-playground:
    needs: [compiler-build]
    name: compiler-gate (playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vibe
        with:
          node-version: 24
          wasmtime: 'true'
      - name: Cache seed artifact
        # WITHOUT THIS STEP THIS JOB REBUILDS THE SEED FROM SOURCE.
        # bootstrap/seed/compiler.wasm is gitignored, so the first thing that
        # touches the compiler calls ensure_seed.sh -- and when the pinned
        # release tag is not published yet (a bootstrap bump before its
        # `seed-release` run lands), ensure_seed REBUILDS the pinned seed:
        # stage0 -> stage1 -> stage2, ~5 minutes, silently, inside whatever
        # step happened to ask first. Measured on run 34567587111: 304s in
        # "Generated compiler fingerprint" here, 323s in compiler-playground,
        # 335s in compiler-docs and 429s inside structural-lint's
        # review-regressions self-test -- four jobs paying the same 5 minutes
        # for the same artifact. The cache key is the pin, so one run pays it
        # and every later one restores in ~2s.
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Install wasmtime
        # The gates below run compiled sample wasm through the wasmtime
        # binary. It used to be conditioned on the in-job stage2 build being
        # cold; that build now happens once in compiler-build, so the
        # condition is gone and this is unconditional.
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Toolchain identity for the viberun cache key
        # THE STAMP INCLUDES rustc, SO THE KEY MUST TOO (Codex review of #2645).
        # ensure_viberun.sh hashes `rustc --version` -- a binary built by a
        # different toolchain is a different binary. But the key was a function
        # of the manifests and sources only, so when ubuntu-latest advances its
        # Rust the exact key still HITS, the restored stamp disagrees, the job
        # rebuilds, and the immutable entry cannot be replaced: the same
        # rebuild-forever trap the v1 -> v2 bump just fixed, recreated by the
        # input I added to fix something else. The toolchain goes in the key.
        id: rustc
        run: echo "id=$(rustc --version | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache viberun build
        # KEY NAMESPACE v1 -> v2 ON PURPOSE (Codex review of #2645). The v1
        # entries were archived before scripts/ensure_viberun.sh existed, so
        # they carry a target/ with no .viberun_srchash. An actions/cache entry
        # is IMMUTABLE once created -- a later run that restores it and then
        # tries to save cannot replace it ("Unable to reserve cache with key
        # ...", seen on the stage2 and gen caches in run 34567587111) -- so an
        # exact hit on a v1 entry would fail the stamp check, rebuild, fail to
        # save the stamp, and repeat that 205-239s rebuild forever. A new
        # namespace is what lets the first run archive an entry that contains
        # the stamp.
        #
        # install/install.sh builds runtime/viberun with `cargo build --release`
        # unless target/release/viberun already exists. Uncached that is the
        # whole step: on run 34567587111 this job spent ~215s there and printed
        # nothing, while the check it exists for took 23s. The key is
        # Cargo.lock + src, which does not move when the compiler changes, so
        # unlike the compiler caches this one actually hits.
        #
        # actions/cache over target/, not Swatinem/rust-cache: rust-cache
        # deliberately drops the workspace crate's own artifacts and keeps only
        # dependencies, so the binary is relinked every run -- which is why
        # perf-metrics still paid 104s with a cache step in place.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/viberun/target
          key: viberun-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('runtime/viberun/Cargo.lock', 'runtime/viberun/Cargo.toml') }}-${{ hashFiles('runtime/viberun/src/**') }}
          restore-keys: |
            viberun-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('runtime/viberun/Cargo.lock', 'runtime/viberun/Cargo.toml') }}-
      - name: Ensure viberun matches the current sources
        # NOT `cargo build` directly. Cargo's fingerprint for a local package
        # is mtime-based, and actions/checkout writes every source with
        # mtime = now, so cargo rebuilds from scratch on EVERY run no matter
        # what the cache restored -- measured on run 34579840316, where the
        # cache restored in 5-7s and the build still took 205s here and 239s
        # in compiler-playground. ensure_viberun.sh asks the question the
        # cache key already asks: it hashes the sources and skips cargo when
        # the content is unchanged (0.03s), while a real source change still
        # rebuilds.
        run: bash scripts/ensure_viberun.sh
      - name: Use the compiler built once for this run
        uses: ./.github/actions/use-compiler-build
      - name: Stage cached compiler
        run: |
          mkdir -p _build/selfhost/generations/ci-playground
          cp _build/_ci_shard_gen/stage2.wasm _build/selfhost/generations/ci-playground/stage2.wasm
      - name: playground preset type-check
        # playground/src/main.ts embeds its starter programs as TypeScript
        # template literals, so they are vibe source no vibe tool ever saw. Two
        # of the four presets carried BOTH dead spellings (`with { Error }` --
        # braced row removed in #1429, `Error` retired in #1461) and stayed
        # broken until someone opened the page (#1497). They are the first vibe
        # a visitor runs, so they are the worst place to leave rot.
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          PLAYGROUND_STAGE2="${gen}stage2.wasm" bash scripts/check_playground_presets.sh

