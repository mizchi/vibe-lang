name: CI

on:
  push:
    branches:
      - main
  pull_request:

# vibe is selfhost-only (the MoonBit host src/ was retired in #594). CI runs the
# selfhost-only gate: bundle/module-source sync + seed->stage1->stage2
# ->stage3 selfbuild with the stage2==stage3 fixpoint and per-stage compile/run
# validation. No MoonBit toolchain is installed or used.
#
# Wall-time layout (2026-07 rework, target: required checks green < 5min):
#   - compiler-gate      (~2.5min) gate script + KPI + normalize smoke
#   - unit-tests 0..3    (~3min)   weight-balanced shards of the 467-file
#                                  battery; each shard self-builds stage2 from
#                                  the committed flat module source (~20-30s,
#                                  cached across runs on the same source)
#                                  instead of waiting on compiler-gate
#   - coverage-suite     main-only, its own job (used to run INSIDE
#                                  compiler-gate and double its wall time)
#   - wasi-p3-gate       needs compiler-gate's stage2 artifact (unchanged)
# All jobs start at t=0; nothing on the required path serializes behind
# another job.
jobs:
  compiler-gate:
    name: compiler-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        # bootstrap/seed/compiler.wasm is a local build cache (gitignored,
        # not git-tracked) — fetch it from its pinned release tag if the
        # actions/cache step above didn't already restore it.
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        # The gate runs compiled sample wasm via wasmtime (exceptions/exnref).
        # Pinned to match the toolchain the seed/runner are validated against.
        # Ratified wasi:http@0.3.0 cutover (#821): bumped 45.x -> 46.0.1.
        # 0.4.0 threads prep: bumped 46.0.1 -> 47.0.2 (-S threads removed
        # upstream; repo never used it — active gates are -W side only).
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Compiler gate
        run: bash scripts/compiler_gate.sh
      - name: Selfcompile KPI heap gate (#987)
        # One real compile through the gate's freshly-built stage2, gated on
        # the linear backend's bump-allocator high-water (heap_ptr_bytes).
        # Unlike wall time it is byte-deterministic for a fixed (stage2,
        # input) pair — scripts/selfcompile_kpi.sh isolates the build cache —
        # so it can block CI without flakes. Threshold = committed baseline
        # + 10%; the baseline tracks the compiler itself, so rebaseline it
        # alongside intentional allocation changes (procedure in
        # bench/perf/heap_baseline.txt).
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          baseline="$(grep -vE '^\s*(#|$)' bench/perf/heap_baseline.txt | head -1)"
          export VIBE_KPI_MAX_HEAP_BYTES=$(( baseline * 110 / 100 ))
          echo "baseline=$baseline gate_max=$VIBE_KPI_MAX_HEAP_BYTES (+10%)"
          bash scripts/selfcompile_kpi.sh "${gen}stage2.wasm"
      - name: Compiler output size ratchet (#1109-4)
        # The sizes the compiler PRODUCES for bench/binary_size/*.vibe,
        # gated per-sample at baseline +2%. Byte-deterministic for a fixed
        # (stage2, sample) pair, so it blocks without flakes. This protects
        # the #1107 Phase 1-4 codegen wins (release strip, funcref table
        # minimization) that the perf report only observed. The compiler's
        # OWN artifact sizes are deliberately NOT gated -- they grow with
        # every feature; see bench/perf/size_baseline.txt's header.
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          bash scripts/size_ratchet.sh "${gen}stage2.wasm"
      - name: vibe normalize smoke test (#882)
        # compiler_gate.sh's "normalize compile+run regression" section
        # exercises the normalize ENGINE directly (VIBE_NORMALIZE=1 against
        # the freshly-built stage2) but never through the seed-driven
        # scripts/vibe_normalize.sh protocol that scripts/vibe_normalize_smoke.sh
        # (Taskfile testVibeNormalizeSmoke) actually drives. Wire the smoke
        # test in here too so that path is gated (it was previously defined
        # but never invoked by any workflow).
        run: bash scripts/vibe_normalize_smoke.sh
      - name: Tutorial executable-docs check (#1142)
        # docs/tutorial/*.vibe.md's ```vibe run blocks are compiled and run
        # against the freshly-built stage2 and their embedded ```output must
        # still match -- keeps a compiler change or a stale doc edit from
        # passing every other required gate unnoticed (this was a required-
        # check gap noted in #1154's review).
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          VIBE_MD_STAGE2="${gen}stage2.wasm" bash scripts/vibe_md.sh check docs/tutorial/*.vibe.md
      - name: Stage stage2 for downstream gates (#821)
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          mkdir -p _build/ci-artifacts
          cp "${gen}stage2.wasm" _build/ci-artifacts/stage2.wasm
      - name: Upload stage2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-stage2
          path: _build/ci-artifacts/stage2.wasm
          if-no-files-found: error

  # vibe-fmt lint (scripts/check_vibe_fmt.sh): every lib/**/*.vibe file
  # must be a fixpoint of the selfhost formatter unless grandfathered in
  # scripts/vibe_fmt_allowlist.txt (ratchet, mirrors lint-architecture-debt).
  # Needs only node (vibe_fmt.sh drives the committed seed through the node
  # host runner, no wasmtime), so this runs standalone and overlaps
  # compiler-gate/unit-tests instead of serializing behind them.
  vibe-fmt-check:
    name: vibe-fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: vibe-fmt lint
        run: bash scripts/check_vibe_fmt.sh

  # The 467-file selfhost unit-test battery (#531/#535), weight-balanced into
  # parallel shards (scripts/unit_test_weights.tsv drives the LPT partition
  # inside unit_test_runner.sh). Each shard builds its own stage2 from the
  # committed flat module source — seed->stage1->stage2 is ~20-30s with the
  # bundle regeneration skipped, and the result is byte-identical to the
  # gate's stage2 (the gate separately verifies the committed flat source is
  # in sync and that the build reaches the stage2==stage3 fixpoint) — so the
  # shards run concurrently with compiler-gate instead of behind it.
  unit-tests:
    name: unit-tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Cache stage2 (keyed on seed + flat module source)
        # The stage2 build is a deterministic function of (seed, committed
        # flat module source, runner). When neither changed since a previous
        # run, restore it and skip the ~30s build entirely.
        id: stage2-cache
        uses: actions/cache@v4
        with:
          path: _build/_ci_shard_gen
          key: stage2-v1-${{ hashFiles('bootstrap/seed.json', 'lib/@vibe/compiler/_cli_adapter_module_source.vibe', 'scripts/generations.sh', 'scripts/wasm_vibe_host_runner.js') }}
      - name: Build stage2 from committed flat module source
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: |
          VIBE_PREBUILT_MODULE_SOURCE=lib/@vibe/compiler/_cli_adapter_module_source.vibe \
            bash scripts/generations.sh build --out-dir _build/_ci_shard_gen
      - name: Restore persistent compile cache
        # Content-keyed compiler cache (_build/vibe_selfhost_*, see
        # docs/build-cache.md): every row's key folds in the codegen
        # fingerprint, so entries from an older compiler are simply ignored
        # on lookup — restoring is always safe, and a warm cache shaves
        # ~25% off the per-file compiles when the compiler is unchanged.
        uses: actions/cache@v4
        with:
          path: _build/vibe_selfhost_*
          key: vibecache-v1-${{ hashFiles('lib/@vibe/compiler/cache/codegen_fingerprint.vibe') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            vibecache-v1-${{ hashFiles('lib/@vibe/compiler/cache/codegen_fingerprint.vibe') }}-shard${{ matrix.shard }}-
      - name: Compiler unit-test runner (shard ${{ matrix.shard }}/4)
        run: |
          VIBE_STAGE2_WASM="$PWD/_build/_ci_shard_gen/stage2.wasm" \
          VIBE_UNIT_TEST_SHARD="${{ matrix.shard }}/4" \
            bash scripts/unit_test_runner.sh

  # Selfhost suite coverage gate (#535), main-only. Re-runs the entire
  # allowlist under function/branch hit instrumentation and enforces the
  # ratcheting minimums (defaults in scripts/coverage_suite.sh; raise them as
  # coverage improves, lowering needs a rationale in the PR). This used to be
  # a step INSIDE compiler-gate, doubling that job's wall time on every main
  # push; as its own job it overlaps everything else and the required path
  # never waits on it. An instrumentation-only miscompile is still caught at
  # most one merge late, never silently for good.
  coverage-suite:
    name: coverage-suite (main only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Cache stage2 (keyed on seed + flat module source)
        id: stage2-cache
        uses: actions/cache@v4
        with:
          path: _build/_ci_shard_gen
          key: stage2-v1-${{ hashFiles('bootstrap/seed.json', 'lib/@vibe/compiler/_cli_adapter_module_source.vibe', 'scripts/generations.sh', 'scripts/wasm_vibe_host_runner.js') }}
      - name: Build stage2 from committed flat module source
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: |
          VIBE_PREBUILT_MODULE_SOURCE=lib/@vibe/compiler/_cli_adapter_module_source.vibe \
            bash scripts/generations.sh build --out-dir _build/_ci_shard_gen
      - name: Selfhost suite coverage gate (#535)
        # Relative path: coverage_suite.sh historically rebased $cli onto the
        # repo root (it now tolerates absolute paths too, but stay canonical).
        run: |
          VIBE_SUITE_CLI_WASM="_build/_ci_shard_gen/stage2.wasm" \
            bash scripts/coverage_suite.sh
      - name: Upload compiler suite coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-suite-coverage
          path: _build/coverage/selfhost-suite/selfhost_suite.report.json
          if-no-files-found: ignore

  # WASI p3 guarantee (#821): vibe-built async components + the wasi:http p3
  # serve pipeline must run on pinned wasmtime, with missing tools treated as
  # FAILURES (no silent skip). Not yet folded into ci-required; promote once
  # green for a week on the wasmtime 47 leg.
  #
  # Single leg, ratified WASI 0.3.0 (#821 cutover, done): the vendored WIT
  # (lib/@vibe/wasi/wit/p3) was refreshed to wasi:http@0.3.0, matching what
  # wasmtime 46+ serves by default (component-model-async on by default
  # too). Both phases pass. A wasmtime 45.x compat leg (phase A / async only
  # -- 45 only ever served the pre-cutover RC world, so it couldn't link
  # phase B / http at all) was dropped once 47 had been the sole target
  # everywhere else in this repo for a while; see git history if 45 compat
  # ever needs re-checking.
  wasi-p3-gate:
    name: wasi-p3-gate (wasmtime v47.0.2)
    needs: [compiler-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-v47.0.2-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.2/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Install wasm-tools / wac
        # Prebuilt release binaries (validated versions; cargo install is the
        # fallback so a renamed asset degrades to a slow build, not a red run).
        env:
          WASM_TOOLS_VERSION: "1.253.0"
          # 0.10.1 verified locally: `wac plug` of the p3 handler + wasmtime
          # serve is green on both 45 and 46 (the 0.8.1/0.9.0 failures in
          # docs/knowledge.md are resolved upstream — no fork needed for
          # this shape).
          WAC_VERSION: "0.10.1"
        run: |
          set -euo pipefail
          mkdir -p "$PWD/p3-tools"
          if curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" | tar -xz; then
            cp "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$PWD/p3-tools/"
          else
            cargo install wasm-tools --locked --version "$WASM_TOOLS_VERSION" --root "$PWD/p3-tools-cargo"
            cp "$PWD/p3-tools-cargo/bin/wasm-tools" "$PWD/p3-tools/"
          fi
          if curl -fsSL -o "$PWD/p3-tools/wac" "https://github.com/bytecodealliance/wac/releases/download/v${WAC_VERSION}/wac-cli-x86_64-unknown-linux-musl"; then
            chmod +x "$PWD/p3-tools/wac"
          else
            cargo install wac-cli --locked --root "$PWD/p3-tools-cargo"
            cp "$PWD/p3-tools-cargo/bin/wac" "$PWD/p3-tools/"
          fi
          echo "$PWD/p3-tools" >> "$GITHUB_PATH"
      - name: Add wasm32 target for the http adapter
        run: rustup target add wasm32-unknown-unknown
      - name: Download stage2 artifact
        uses: actions/download-artifact@v4
        with:
          name: compiler-stage2
          path: _build/ci-artifacts/
      - name: WASI p3 guarantee gate
        env:
          VIBE_P3_GATE_REQUIRE_TOOLS: "1"
          VIBE_P3_GATE_PHASES: "async,http"
          VIBE_ASYNC_GATE_COMPILER: ${{ github.workspace }}/_build/ci-artifacts/stage2.wasm
          VIBE_SERVE_CLI_WASM: ${{ github.workspace }}/_build/ci-artifacts/stage2.wasm
        run: bash scripts/test_wasi_p3_guarantee_gate.sh

  # Aggregate required check (branch protection requires "ci-required").
  ci-required:
    name: ci-required
    needs: [compiler-gate, unit-tests, vibe-fmt-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.compiler-gate.result }}" != "success" ]; then
            echo "::error::compiler-gate did not succeed (${{ needs.compiler-gate.result }})"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::unit-tests did not succeed (${{ needs.unit-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.vibe-fmt-check.result }}" != "success" ]; then
            echo "::error::vibe-fmt-check did not succeed (${{ needs.vibe-fmt-check.result }})"
            exit 1
          fi
          echo "all required jobs passed"
