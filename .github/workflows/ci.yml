name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  VIBE_MOON_WARN_LIST: "-1-6-7-9-20-24-27-29"

jobs:
  lint-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  contract-moon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'

      - name: Run moon test (verbose, for flaker)
        run: |
          moon test --target js -v 2>&1 | tee .flaker-test-output.txt || true

      - name: Upload test results for flaker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moontest-results
          path: .flaker-test-output.txt
          retention-days: 30

      - name: PR contract checks (MoonBit/js)
        id: contract_moon
        run: bash scripts/pkfire/contract_moon.sh 2>&1 | tee /tmp/contract_moon.log
        continue-on-error: true

      - name: Surface contract-moon failure in annotations
        if: steps.contract_moon.outcome == 'failure'
        run: |
          echo "::error::contract-moon failed; tail of log follows:"
          tail -80 /tmp/contract_moon.log | while IFS= read -r line; do
            echo "::error::cm: $line"
          done
          exit 1

  contract-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          wasmtime: 'true'
          vibe-debug-cache: 'true'

      - name: PR contract checks (native/runtime)
        run: bash scripts/pkfire/contract_native.sh

  native-binary-parity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          wasmtime: 'true'
          wasm-tools: 'true'
          vibe-debug-cache: 'true'

      - name: Native binary parity checks
        run: bash scripts/pkfire/native_binary_parity.sh

  bundle-size-compiler:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'

      - name: Compiler bundle-size golden
        continue-on-error: true
        run: scripts/bench_compiler_bundle_size.sh

  bundle-size-product-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'

      - name: Product bundle-size gate
        id: product_bundle_size
        continue-on-error: true
        run: scripts/bench_bundle_size.sh

      - name: Product bundle-size summary
        if: always()
        run: |
          echo "### Product WASM Bundle Size" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.product_bundle_size.outcome }}" = "success" ]; then
            echo "- Status: within budget" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: regression detected (blocking gate)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f dist/bundle_size/current.tsv ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current report: \`dist/bundle_size/current.tsv\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload product bundle-size report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bundle-size-product-report
          path: dist/bundle_size/current.tsv
          if-no-files-found: ignore

  wasm-vibe-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'

      - name: Build wasm/vibe artifact
        run: |
          moon build --target wasm-gc --release src/lib
          mkdir -p wasm/vibe
          cp _build/wasm-gc/release/build/lib/lib.wasm wasm/vibe/vibe.wasm

      - name: Smoke test wasm/vibe with wasmtime
        run: ./scripts/test_wasm_vibe_wasmtime.sh wasm/vibe/vibe.wasm

  wasm-codegen-quick:
    if: github.event_name == 'push'
    name: wasm-codegen-quick (${{ matrix.shard }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [core, compare, http]
    steps:
      - uses: actions/checkout@v5
      - name: Init wasmtime submodule
        if: matrix.shard == 'http'
        run: git submodule update --init deps/wasmtime
      - name: Install Rust toolchain
        if: matrix.shard == 'http'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        if: matrix.shard == 'http'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-wasm-quick-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build_wasi_http_p3*.sh') }}
          restore-keys: cargo-wasm-quick-${{ runner.os }}-
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          wasmtime: 'true'
          wasm-tools: 'true'
          node-version: '24'
      - name: Build vibe CLI (native debug)
        run: VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Set VIBE_BIN for debug binary
        run: echo "VIBE_BIN=$(pwd)/_build/native/debug/build/cmd/vibe/vibe.exe" >> "$GITHUB_ENV"
      - name: Run wasm quick shard (${{ matrix.shard }})
        run: bash scripts/pkfire/wasm_quick_shard.sh ${{ matrix.shard }}

  wasm-parity:
    name: wasm-parity (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: handle
            suite: handle
            shard_index: 0
            shard_total: 1
          - name: pattern (0)
            suite: pattern
            shard_index: 0
            shard_total: 2
          - name: pattern (1)
            suite: pattern
            shard_index: 1
            shard_total: 2
    steps:
      - uses: actions/checkout@v5
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Set VIBE_BIN for release binary
        run: echo "VIBE_BIN=$(pwd)/target/native/release/build/cmd/vibe/vibe.exe" >> "$GITHUB_ENV"
      - name: Run wasm parity suite (${{ matrix.name }})
        id: wasm_parity_suite
        run: |
          case "${{ matrix.suite }}" in
            handle)
              ./scripts/test_handle_exception_wasm_match.sh
              ;;
            pattern)
              ./scripts/test_run_wasm_match.sh
              ;;
            *)
              echo "unknown wasm parity suite: ${{ matrix.suite }}" >&2
              exit 1
              ;;
          esac
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
      - name: WASM parity summary (${{ matrix.name }})
        if: always()
        run: |
          {
            echo "### WASM Parity: ${{ matrix.name }}"
            if [ "${{ steps.wasm_parity_suite.outcome }}" = "success" ]; then
              echo "- Status: passed"
            else
              echo "- Status: regression detected"
              echo "- Repro: \`./scripts/test_handle_exception_wasm_match.sh\` or \`./scripts/test_run_wasm_match.sh\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  wasm-compile-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'
      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: WASM compile E2E (shard ${{ matrix.shard }}/4)
        id: wasm_compile_e2e
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        run: ./scripts/test_wasm_compile_wasmtime.sh
      - name: WASM compile E2E summary (shard ${{ matrix.shard }}/4)
        if: always()
        run: |
          {
            echo "### WASM Compile E2E: shard ${{ matrix.shard }}/4"
            if [ "${{ steps.wasm_compile_e2e.conclusion }}" = "success" ]; then
              echo "- Status: passed"
            else
              echo "- Status: failed"
              echo "- Repro: \`SHARD_INDEX=${{ matrix.shard }} SHARD_TOTAL=4 ./scripts/test_wasm_compile_wasmtime.sh\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  selfhost-bootstrap-gate:
    name: selfhost-bootstrap-gate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Init wasmtime submodule
        run: git submodule update --init deps/wasmtime
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          wasmtime: 'true'
          wasm-tools: 'true'
          node-version: '24'
      - name: Build vibe CLI (native debug)
        run: VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Set VIBE_BIN for debug binary
        run: echo "VIBE_BIN=$(pwd)/_build/native/debug/build/cmd/vibe/vibe.exe" >> "$GITHUB_ENV"
      - name: Run selfhost bootstrap + selfbuild KPI
        # Lightweight (no Rust/wasm32/wac) selfhost gate: bootstrap probe +
        # `test-selfhost-wasi-selfbuild-kpi` (300s wall-time budget).
        # Runs on every PR for early selfhost-regression signal; the
        # heavier `selfhost-gates` matrix (cli / check) stays push-only.
        run: bash scripts/pkfire/selfhost_gates_shard.sh bootstrap

  selfhost-gates:
    if: github.event_name == 'push'
    name: selfhost-gates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [cli, check]
    steps:
      - uses: actions/checkout@v5
      - name: Init wasmtime submodule
        run: git submodule update --init deps/wasmtime
      - name: Install Rust toolchain
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-selfhost-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/build_selfhost_*component*.sh') }}
          restore-keys: cargo-selfhost-${{ runner.os }}-
      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          wasmtime: 'true'
          wasm-tools: 'true'
          node-version: '24'
      - name: Install wac
        if: matrix.shard == 'cli' || matrix.shard == 'check'
        run: |
          if ! command -v wac >/dev/null 2>&1; then
            cargo install wac-cli --version 0.9.0 --locked
          fi
      - name: Build vibe CLI (native debug)
        run: VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'
      - name: Set VIBE_BIN for debug binary
        run: echo "VIBE_BIN=$(pwd)/_build/native/debug/build/cmd/vibe/vibe.exe" >> "$GITHUB_ENV"
      - name: Run selfhost gate shard (${{ matrix.shard }})
        run: bash scripts/pkfire/selfhost_gates_shard.sh ${{ matrix.shard }}

  e2e-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'
          wasm-tools: 'true'
          node-version: '24'

      - name: Run Component E2E tests
        run: ./scripts/test_component_e2e.sh

  selfhost-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          wasmtime: 'true'
          node-version: '24'

      - name: Build selfhost compiler
        run: VIBE_DIST_SKIP_OPT=1 bash scripts/build_selfhost_dist.sh

      - name: Selfhost examples compile+run
        run: bash scripts/pkfire/selfhost_examples_smoke.sh

      - name: wasm-gc validation gate
        run: bash scripts/test_wasm_gc_validate.sh

      - name: Selfhost runtime fixtures
        id: selfhost_runtime_fixtures
        if: always()
        run: |
          set +e
          bash scripts/test_selfhost_runtime_fixtures.sh
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Selfhost runtime fixtures summary
        if: always()
        run: |
          {
            echo "### Selfhost Runtime Fixtures"
            if [ "${{ steps.selfhost_runtime_fixtures.outputs.exit_code }}" = "0" ]; then
              echo "- Status: passed"
            else
              echo "- Status: drift or runtime regression detected (non-blocking)"
              echo "- Repro: \`bash scripts/test_selfhost_runtime_fixtures.sh\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # moonrun_wt host parity + import-surface drift guard. Keeps the
  # wasmtime-aot bench backend (TODO #295) honest: any divergence in
  # emitted `.wasm` between moonrun and moonrun_wt, or any new
  # moon `--target wasm` import that we haven't wired into
  # `tools/moonrun_wasmtime/src/main.rs`, will fail this job.
  #
  # Cache layout (3 stacked caches, restored independently):
  #   - moon `_build`/`.mooncakes` via setup-vibe (moon-build-cache):
  #     skips `moon build --target wasm` on unchanged sources.
  #   - cargo registry + `tools/moonrun_wasmtime/target`: skips the
  #     moonrun_wt cargo build on unchanged Cargo.toml + src.
  #   - `_build/wasm/opt/*.cwasm`: skips the wasmtime AOT compile step
  #     when both stage1 wasm and moonrun_wt source are unchanged. Key
  #     uses input hashes (not artifact hashes) so it can be restored
  #     before the build steps run.
  selfhost-runtime-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          moon-build-cache: 'true'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            tools/moonrun_wasmtime/target
          key: cargo-moonrun-wt-${{ runner.os }}-${{ hashFiles('tools/moonrun_wasmtime/Cargo.toml', 'tools/moonrun_wasmtime/src/**') }}
          restore-keys: cargo-moonrun-wt-${{ runner.os }}-

      # Restore previously AOT-compiled cwasm artifacts. Cache key bakes
      # the wasmtime version (Cargo.toml) + moonrun_wt source + the moon
      # toolchain version + the stage1 wasm source tree, so any change
      # to inputs that could alter cwasm output forces a fresh compile.
      # mizchi/vibe-lang's wasmtime is pinned at 42.0.1; cwasm produced
      # by a different wasmtime version is UB to load.
      - name: Restore stage1 cwasm cache
        id: cwasm-cache
        uses: actions/cache/restore@v5
        with:
          path: _build/wasm/opt/*.cwasm
          key: stage1-cwasm-${{ runner.os }}-wt:${{ hashFiles('tools/moonrun_wasmtime/Cargo.toml', 'tools/moonrun_wasmtime/src/**') }}-wasm:${{ hashFiles('.moon-version', 'moon.mod.json', '**/moon.pkg.json', 'src/**/*.mbt') }}

      - name: Build stage1 wasm (compile + check)
        run: |
          moon build --target wasm src/cmd/vibe_compile_wasi
          moon build --target wasm src/cmd/vibe_check_wasi

      - name: Selfhost portable boundary guard
        run: bash scripts/check_selfhost_portable_boundary.sh

      - name: Build moonrun_wt
        run: cargo build --release --manifest-path tools/moonrun_wasmtime/Cargo.toml

      # On a cwasm cache hit the restored cwasm files arrived with their
      # original mtime, which can be older than the wasm files just
      # rebuilt by `moon build` (moon may rewrite the .wasm even when its
      # content is identical). The mtime check in
      # `test_moonrun_wt_parity.sh`/`bench_selfhost_perf.sh` would then
      # re-precompile and wipe the cache benefit. Touching after both
      # builds ensures cwasm > wasm on the cache-hit path. Safe because
      # the cache key already pins every input that could change cwasm
      # output (wasmtime version + moonrun_wt source + moon version +
      # stage1 wasm source).
      - name: Mark cwasm as fresh on cache hit
        if: steps.cwasm-cache.outputs.cache-hit == 'true'
        run: |
          set -e
          for f in _build/wasm/opt/vibe_compile_wasi.cwasm _build/wasm/opt/vibe_check_wasi.cwasm; do
            if [ -f "$f" ]; then
              touch "$f"
              echo "[cwasm-cache] reused $f"
            fi
          done

      - name: Import-surface drift guard
        run: bash scripts/check_moonrun_wt_imports.sh

      - name: Output parity (byte-identical compile)
        env:
          VIBE_PARITY_WASM_PROFILE: debug
        run: bash scripts/test_moonrun_wt_parity.sh

      - name: Daemon-mode parity (one-shot vs --daemon)
        # Guards #400's warm-instance reuse: --daemon must produce
        # byte-identical check output to fresh-process invocations.
        env:
          VIBE_PARITY_WASM_PROFILE: debug
        run: bash scripts/test_moonrun_wt_daemon_parity.sh

      # Persist freshly built cwasm so the next run skips precompile.
      # Save unconditionally (not only on cache miss): the parity script
      # may regenerate cwasm if mtimes drift, and we'd like that result
      # cached too.
      - name: Save stage1 cwasm cache
        if: always() && steps.cwasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: _build/wasm/opt/*.cwasm
          key: ${{ steps.cwasm-cache.outputs.cache-primary-key }}

  # Selfhost perf KPI gate — split out of the former
  # `coverage-selfhost-suite` job (which conflated perf-ratio gating
  # with coverage measurement). They share no signal: the KPI cap
  # gating compile/check ratio failed independently of coverage,
  # which hid the coverage result behind a perf regression. Two
  # jobs let each gate's status be read directly.
  selfhost-perf-kpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          wasmtime: 'true'
          moon-build-cache: 'true'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry (moonrun_wt)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            tools/moonrun_wasmtime/target
          key: cargo-moonrun-wt-${{ runner.os }}-${{ hashFiles('tools/moonrun_wasmtime/Cargo.toml', 'tools/moonrun_wasmtime/src/**') }}
          restore-keys: cargo-moonrun-wt-${{ runner.os }}-

      - name: Restore stage1 cwasm cache
        id: cwasm-cache-kpi
        uses: actions/cache/restore@v5
        with:
          path: _build/wasm/opt/*.cwasm
          key: stage1-cwasm-${{ runner.os }}-wt:${{ hashFiles('tools/moonrun_wasmtime/Cargo.toml', 'tools/moonrun_wasmtime/src/**') }}-wasm:${{ hashFiles('.moon-version', 'moon.mod.json', '**/moon.pkg.json', 'src/**/*.mbt') }}

      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'

      - name: Build moonrun_wt (wasmtime host)
        run: cargo build --release --manifest-path tools/moonrun_wasmtime/Cargo.toml

      # Touch restored cwasm AFTER moon may have rewritten the wasm,
      # so the perf script's mtime check reuses the cached precompile.
      # Same invariant as `selfhost-runtime-parity` job: cache key bakes
      # every input that could change cwasm content.
      - name: Mark cwasm fresh on cache hit
        if: steps.cwasm-cache-kpi.outputs.cache-hit == 'true'
        run: |
          set -e
          for f in _build/wasm/opt/vibe_compile_wasi.cwasm _build/wasm/opt/vibe_check_wasi.cwasm; do
            [ -f "$f" ] && touch "$f" && echo "[cwasm-cache] reused $f"
          done

      - name: Run selfhost perf KPI
        env:
          VIBE_USE_SESSION_HTTP: '0'
          # Daemon-mode for selfhost check (#400). Batches all RUNS
          # check requests through one warm wasm instance — eliminates
          # the per-invocation ensure_builtin_modules cold-start cost
          # that dominated the check_ratio under one-shot moonrun_wt.
          # Local measurement on the KPI cases (release+O3, runs=3):
          #   one-shot:  TOTAL check ratio 0.131 (per-case median ~150ms self)
          #   daemon:    TOTAL check ratio 0.005 (per-case median ~5ms self)
          # Compile path unchanged (still one-shot).
          VIBE_SELFHOST_PERF_CHECK_DAEMON: '1'
        # Switched to wasmtime-aot default (#402 Phase 2).
        # KPI cases, release + wasm-opt -O3, runs=3 median, with
        # VIBE_USE_SESSION_HTTP=0 (matches this step's env):
        #
        # One-shot (pre-#400-daemon) CI baseline:
        #          TOTAL compile  TOTAL check  per-case worst check
        #   local      0.918         2.522        3.10 (effects)
        #   CI         1.000         2.878        13.3 (effects, total)
        #
        # With daemon mode (#400) the check ratio collapses by ~25×
        # because the 179ms ensure_builtin_modules cost is paid once
        # per case instead of RUNS times. We keep the check cap at
        # 5.0 conservatively for now — letting the daemon-mode CI
        # numbers settle for a few PRs before tightening (tightening
        # the cap to e.g. 1.0 belongs in a follow-up once we have
        # stable observations).
        #
        # The per-case `check/total` numbers swing wide because host
        # check time per case is tiny (~10 ms) without session-http —
        # variance hits hard in % terms. The harness gates on TOTAL
        # ratio across cases, which is what these caps target.
        #
        # Caps after #405 (daemon mode landed):
        #   compile 1.5  (local 0.901 → 1.66× headroom)
        #   check   1.0  (local 0.096 → 10× headroom)
        #
        # First tightening pass — we only have one CI data point on
        # main under daemon mode (#405 merge) so headroom stays
        # generous to absorb the ±20-30% CI variance we typically
        # see vs local. The 1.0 check cap still catches a
        # moonrun-class regression: the moonrun-baseline check_ratio
        # was 2.88×, so anything that pushes back near that path
        # trips the gate.
        #
        # Follow-up tightening (e.g. compile 1.2, check 0.5) belongs
        # in a separate PR once we have 5-10 CI runs of daemon-mode
        # numbers to characterize variance.
        #
        # NOTE: an early version of this step used check cap 0.5
        # based on a local measurement that accidentally included
        # session-http daemon spawn cost in `host_check_ms` (~1100
        # ms/case), which made the ratio look ~30× lower than it
        # actually is under the CI env. Don't repeat that — keep
        # VIBE_USE_SESSION_HTTP=0 set wherever this bench runs.
        #
        # Opt back into moonrun (e.g. no rust toolchain) with
        # `VIBE_SELFHOST_PERF_RUNTIME=moonrun` (daemon-mode is a
        # no-op for moonrun): the moonrun path's check_ratio was
        # ~5-8 and compile_ratio ~2.7, so these tightened caps will
        # trip on that runtime. Override the caps in env if you
        # need to run the moonrun path: `MAX_COMPILE_RATIO=10.0`
        # `MAX_CHECK_RATIO=8.5`.
        run: VIBE_SELFHOST_PERF_RUNS=3 VIBE_SELFHOST_PERF_MAX_COMPILE_RATIO=1.5 VIBE_SELFHOST_PERF_MAX_CHECK_RATIO=1.0 VIBE_SELFHOST_PERF_CASES_FILE=bench/selfhost_perf/kpi_cases.txt scripts/bench_selfhost_perf.sh

      - name: Save stage1 cwasm cache
        if: always() && steps.cwasm-cache-kpi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: _build/wasm/opt/*.cwasm
          key: ${{ steps.cwasm-cache-kpi.outputs.cache-primary-key }}

      - name: Upload selfhost perf bench raw output
        # Diagnostic artifact for perf KPI failures: gives the actual
        # ratios + per-stage timings + stderr from each measurement so
        # the gate's failure mode (ratio violation vs. command failure)
        # is visible without needing log access.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selfhost-perf-raw
          path: |
            _build/bench/selfhost_perf/raw.e2e.tsv
            _build/bench/selfhost_perf/summary.e2e.tsv
            _build/bench/selfhost_perf/raw_stage.e2e.tsv
            _build/bench/selfhost_perf/stage_summary.e2e.tsv
            _build/bench/selfhost_perf/tmp/*.stderr
          if-no-files-found: ignore

  # Selfhost suite coverage gate — split from the former combined
  # job so the coverage result is independent of the perf KPI cap.
  # Only needs the native vibe CLI + node; no rust / wasmtime / cwasm
  # cache (those belong to `selfhost-perf-kpi`).
  coverage-selfhost-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          moon-build-cache: 'true'
          node-version: '24'

      - name: Build vibe CLI (native)
        run: VIBE_CLI_RELEASE=1 VIBE_CLI_FORCE=1 bash -c 'source scripts/ensure_native_cli.sh'

      - name: Run selfhost suite coverage gate
        env:
          VIBE_USE_SESSION_HTTP: '0'
        run: scripts/coverage_selfhost_suite.sh

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Selfhost Suite Coverage"
            if [ -f _build/coverage/selfhost-suite/selfhost_suite.summary.txt ]; then
              echo '```'
              cat _build/coverage/selfhost-suite/selfhost_suite.summary.txt
              echo '```'
            else
              echo "- No summary produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selfhost-suite-coverage-report
          path: |
            _build/coverage/selfhost-suite/selfhost_suite.summary.txt
            _build/coverage/selfhost-suite/selfhost_suite.report.json
          if-no-files-found: ignore

  coverage-moon:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vibe toolchain
        uses: ./.github/actions/setup-vibe
        with:
          ripgrep: 'true'
          node-version: '24'

      - name: Run moon coverage with line-coverage gate
        # Initial gate at 50%: current baseline measures ~54.3% on
        # `--target js`, so this leaves ~4% of slack against minor
        # regressions while still catching meaningful drops. Raise the
        # threshold (`VIBE_MOON_COVERAGE_MIN_LINE`) as coverage improves
        # toward the TODO.md aspirational target of 70%.
        env:
          VIBE_MOON_COVERAGE_TARGET: js
          VIBE_MOON_COVERAGE_MIN_LINE: '50'
        run: bash scripts/coverage_moon.sh

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Moon Coverage (target=js)"
            if [ -f _build/coverage/moon/summary.txt ]; then
              echo '```'
              grep '^Total:' _build/coverage/moon/summary.txt || echo "(no Total line)"
              echo '```'
            else
              echo "- No summary produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moon-coverage-report
          path: |
            _build/coverage/moon/summary.txt
            _build/coverage/moon/moonbit-cobertura.xml
            _build/coverage/moon/html
          if-no-files-found: ignore

  similarity-mbt-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache similarity-mbt binary
        id: similarity-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/similarity-mbt
          key: similarity-mbt-${{ runner.os }}-v0.5.2

      - name: Install similarity-mbt
        if: steps.similarity-cache.outputs.cache-hit != 'true'
        run: cargo install similarity-mbt --version 0.5.2 --locked

      - name: Run similarity-mbt
        id: sim
        run: |
          set +e
          similarity-mbt src/ --threshold 0.98 > sim-report.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          lines=$(wc -l < sim-report.txt)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Similarity summary
        if: always()
        run: |
          {
            echo "### similarity-mbt duplicate report (threshold 0.98)"
            echo ""
            echo "- Report lines: ${{ steps.sim.outputs.lines }}"
            echo ""
            echo '```'
            head -120 sim-report.txt || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload similarity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: similarity-mbt-report
          path: sim-report.txt
          if-no-files-found: ignore

  ci-required:
    if: always()
    needs:
      - lint-ci
      - contract-moon
      - contract-native
      - e2e-component
      - selfhost-examples
      - selfhost-runtime-parity
      - wasm-compile-e2e
      - wasm-parity
      - wasm-vibe-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check required CI job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled"
            echo ""
            echo "Job results:"
            echo "  lint-ci: ${{ needs.lint-ci.result }}"
            echo "  contract-moon: ${{ needs.contract-moon.result }}"
            echo "  contract-native: ${{ needs.contract-native.result }}"
            echo "  e2e-component: ${{ needs.e2e-component.result }}"
            echo "  selfhost-examples: ${{ needs.selfhost-examples.result }}"
            echo "  selfhost-runtime-parity: ${{ needs.selfhost-runtime-parity.result }}"
            echo "  wasm-compile-e2e: ${{ needs.wasm-compile-e2e.result }}"
            echo "  wasm-parity: ${{ needs.wasm-parity.result }}"
            echo "  wasm-vibe-smoke: ${{ needs.wasm-vibe-smoke.result }}"
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."

  ci-informational:
    if: always()
    needs:
      - bundle-size-compiler
      - bundle-size-product-gate
      - coverage-moon
      - coverage-selfhost-suite
      - native-binary-parity
      - selfhost-bootstrap-gate
      - selfhost-gates
      - selfhost-perf-kpi
      - similarity-mbt-report
      - wasm-codegen-quick
    runs-on: ubuntu-latest
    steps:
      - name: Report informational CI job results
        run: |
          echo "Informational job results (non-blocking):"
          echo "  bundle-size-compiler: ${{ needs.bundle-size-compiler.result }}"
          echo "  bundle-size-product-gate: ${{ needs.bundle-size-product-gate.result }}"
          echo "  coverage-moon: ${{ needs.coverage-moon.result }}"
          echo "  coverage-selfhost-suite: ${{ needs.coverage-selfhost-suite.result }}"
          echo "  native-binary-parity: ${{ needs.native-binary-parity.result }}"
          echo "  selfhost-bootstrap-gate: ${{ needs.selfhost-bootstrap-gate.result }}"
          echo "  selfhost-gates: ${{ needs.selfhost-gates.result }}"
          echo "  selfhost-perf-kpi: ${{ needs.selfhost-perf-kpi.result }}"
          echo "  similarity-mbt-report: ${{ needs.similarity-mbt-report.result }}"
          echo "  wasm-codegen-quick: ${{ needs.wasm-codegen-quick.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo ""
            echo "::warning::Some informational jobs failed (non-blocking)"
          fi
