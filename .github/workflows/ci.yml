name: CI

on:
  push:
    branches:
      - main
  pull_request:

# vibe is selfhost-only (the MoonBit host src/ was retired in #594). CI runs the
# moon-free selfhost-only gate: bundle/module-source sync + seed->stage1->stage2
# ->stage3 selfbuild with the stage2==stage3 fixpoint and per-stage compile/run
# validation. No MoonBit toolchain is installed or used.
jobs:
  selfhost-only-gate:
    name: selfhost-only-gate (moon-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        # The gate runs compiled sample wasm via wasmtime (exceptions/exnref).
        # Pinned to match the toolchain the seed/runner are validated against.
        # Ratified wasi:http@0.3.0 cutover (#821): bumped 45.x -> 46.0.1.
        env:
          WASMTIME_VERSION: v46.0.1
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Selfhost-only gate
        run: bash scripts/selfhost_only_gate.sh
      - name: Selfhost unit-test runner (allowlist)
        # Reuse the stage2 the gate just built (no second selfbuild). Runs the
        # allowlisted *_test.vibe corpus (#531/#535) — the regression net for
        # language/stdlib features the compiler doesn't exercise during selfbuild.
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ 2>/dev/null | head -1)"
          VIBE_STAGE2_WASM="${gen}stage2.wasm" \
            bash scripts/selfhost_unit_test_runner.sh
      - name: Selfhost suite coverage gate (#535)
        # Re-runs the allowlist under function/branch hit instrumentation and
        # enforces the ratcheting minimum rates (defaults in the script; raise
        # them as coverage improves, lowering needs a rationale in the PR).
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ 2>/dev/null | head -1)"
          VIBE_SUITE_CLI_WASM="${gen}stage2.wasm" \
            bash scripts/coverage_selfhost_suite.sh
      - name: Upload selfhost suite coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-suite-coverage
          path: _build/coverage/selfhost-suite/selfhost_suite.report.json
          if-no-files-found: ignore
      - name: Stage stage2 for downstream gates (#821)
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          mkdir -p _build/ci-artifacts
          cp "${gen}stage2.wasm" _build/ci-artifacts/stage2.wasm
      - name: Upload stage2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-stage2
          path: _build/ci-artifacts/stage2.wasm
          if-no-files-found: error

  # WASI p3 guarantee (#821): vibe-built async components + the wasi:http p3
  # serve pipeline must run on pinned wasmtime versions, with missing tools
  # treated as FAILURES (no silent skip). Not yet folded into ci-required;
  # promote once green for a week on the wasmtime 46 primary leg.
  wasi-p3-gate:
    name: wasi-p3-gate (wasmtime ${{ matrix.wasmtime }})
    needs: [selfhost-only-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary leg, ratified WASI 0.3.0 (#821 cutover, done): the
          # vendored WIT (lib/@vibe/wasi/wit/p3) was refreshed to
          # wasi:http@0.3.0, matching what wasmtime 46 serves by default
          # (component-model-async on by default too). Both phases pass.
          - wasmtime: v46.0.1
            phases: "async,http"
          # Compat leg: wasmtime 45.x only ever served the RC world
          # (wasi:http@0.3.0-rc-2026-03-15), which the repo no longer
          # vendors post-cutover, so phase B (http) cannot link against it
          # any more (mirrors the "resource implementation is missing"
          # failure 46 used to hit against the RC world pre-cutover).
          # Phase A (async component vertical) doesn't touch the wasi:http
          # WIT at all, so it still passes unchanged with the wasmtime 45 RC
          # flag set — kept as a smoke test that the async component path
          # doesn't regress on the older runtime during the wasmtime 46
          # rollout. Drop this leg once 46 has been the sole target for a
          # while and 45 compat is no longer a concern.
          - wasmtime: v45.0.2
            phases: "async"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime ${{ matrix.wasmtime }}
        run: |
          set -euo pipefail
          dir="wasmtime-${{ matrix.wasmtime }}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${{ matrix.wasmtime }}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Install wasm-tools / wac
        # Prebuilt release binaries (validated versions; cargo install is the
        # fallback so a renamed asset degrades to a slow build, not a red run).
        env:
          WASM_TOOLS_VERSION: "1.253.0"
          # 0.10.1 verified locally: `wac plug` of the p3 handler + wasmtime
          # serve is green on both 45 and 46 (the 0.8.1/0.9.0 failures in
          # docs/knowledge.md are resolved upstream — no fork needed for
          # this shape).
          WAC_VERSION: "0.10.1"
        run: |
          set -euo pipefail
          mkdir -p "$PWD/p3-tools"
          if curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" | tar -xz; then
            cp "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$PWD/p3-tools/"
          else
            cargo install wasm-tools --locked --version "$WASM_TOOLS_VERSION" --root "$PWD/p3-tools-cargo"
            cp "$PWD/p3-tools-cargo/bin/wasm-tools" "$PWD/p3-tools/"
          fi
          if curl -fsSL -o "$PWD/p3-tools/wac" "https://github.com/bytecodealliance/wac/releases/download/v${WAC_VERSION}/wac-cli-x86_64-unknown-linux-musl"; then
            chmod +x "$PWD/p3-tools/wac"
          else
            cargo install wac-cli --locked --root "$PWD/p3-tools-cargo"
            cp "$PWD/p3-tools-cargo/bin/wac" "$PWD/p3-tools/"
          fi
          echo "$PWD/p3-tools" >> "$GITHUB_PATH"
      - name: Add wasm32 target for the http adapter
        run: rustup target add wasm32-unknown-unknown
      - name: Download stage2 artifact
        uses: actions/download-artifact@v4
        with:
          name: selfhost-stage2
          path: _build/ci-artifacts/
      - name: WASI p3 guarantee gate
        env:
          VIBE_P3_GATE_REQUIRE_TOOLS: "1"
          VIBE_P3_GATE_PHASES: ${{ matrix.phases }}
          VIBE_ASYNC_GATE_COMPILER: ${{ github.workspace }}/_build/ci-artifacts/stage2.wasm
          VIBE_SERVE_CLI_WASM: ${{ github.workspace }}/_build/ci-artifacts/stage2.wasm
        run: bash scripts/test_wasi_p3_guarantee_gate.sh

  # Aggregate required check (branch protection requires "ci-required").
  ci-required:
    name: ci-required
    needs: [selfhost-only-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.selfhost-only-gate.result }}" != "success" ]; then
            echo "::error::selfhost-only-gate did not succeed (${{ needs.selfhost-only-gate.result }})"
            exit 1
          fi
          echo "all required jobs passed"
