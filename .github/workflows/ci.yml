name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Moon check
        run: moon check --target js

      - name: Moon test
        run: moon test --target js

      - name: Vibe normalize check
        run: |
          moon build --target native src/cmd/vibe --warn-list '-29'
          start_ts=$(date +%s%N)
          scripts/vibe_normalize_all.sh --check examples vibe
          end_ts=$(date +%s%N)
          elapsed_ms=$(( (end_ts - start_ts) / 1000000 ))
          file_count=$(find examples vibe -name '*.vibe' -type f | grep -Ev '^examples/wasm/' | wc -l | tr -d ' ')
          echo "### Normalize Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Files | ${file_count} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total | ${elapsed_ms}ms |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$file_count" -gt 0 ]; then
            avg_us=$(( elapsed_ms * 1000 / file_count ))
            echo "| Per-file avg | ${avg_us}us |" >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle-size-compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Compiler bundle-size golden
        run: scripts/bench_compiler_bundle_size.sh

  bundle-size-product-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Product bundle-size monitor (non-blocking)
        id: product_bundle_size
        run: |
          set +e
          scripts/bench_bundle_size.sh
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Product bundle-size summary
        if: always()
        run: |
          echo "### Product WASM Bundle Size" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.product_bundle_size.outputs.status }}" = "0" ]; then
            echo "- Status: within budget" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: regression detected (monitor-only; non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f dist/bundle_size/current.tsv ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current report: \`dist/bundle_size/current.tsv\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload product bundle-size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-product-report
          path: dist/bundle_size/current.tsv
          if-no-files-found: ignore

  wasm-vibe-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Build wasm/vibe artifact
        run: |
          moon build --target wasm-gc --release src/lib
          mkdir -p wasm/vibe
          cp _build/wasm-gc/release/build/lib/lib.wasm wasm/vibe/vibe.wasm

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Smoke test wasm/vibe with wasmtime
        run: ./scripts/test_wasm_vibe_wasmtime.sh wasm/vibe/vibe.wasm

  wasm-codegen-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Check moon info regen cycle (idempotent + deny-warn check)
        run: bash scripts/test_moon_info_regen.sh

      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.219.1/wasm-tools-1.219.1-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.219.1-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.219.1-x86_64-linux/wasm-tools /usr/local/bin/
          wasm-tools --version

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: WASI HTTP P3 blocked gate (monitor-only)
        run: |
          VIBE_WASI_HTTP_P3_REQUIRE_READY=0 \
          VIBE_WASI_HTTP_P3_RUN_COMPOSE=0 \
          ./scripts/test_wasi_http_p3_blocked_gate.sh

      - name: Build vibe CLI (native release)
        run: moon build --target native --release src/cmd/vibe --warn-list '-29'

      - name: Validate selfhost probe wasm fixture
        run: ./scripts/test_selfhost_probe_wasm_validate.sh

      - name: Check handle/exception interpreter vs wasm parity
        run: ./scripts/test_handle_exception_wasm_match.sh

      - name: Check HTTP builtin wasm fallback (validate + catchable throw)
        run: ./scripts/test_http_wasm_fallback.sh

      - name: Check HTTP builtin wasm host-import path (capability + e2e)
        run: ./scripts/test_http_wasm_host_imports.sh

      - name: Check compiled backend HTTP policy (auto fallback / forced reject)
        run: ./scripts/test_compiled_backend_http_policy.sh

      - name: Check component import contract (stable func imports)
        run: ./scripts/test_component_import_contract.sh

      - name: Selfhost bootstrap gate (compiled + probe + deterministic compile)
        run: VIBE_BIN=target/native/release/build/cmd/vibe/vibe.exe ./scripts/test_selfhost_bootstrap_gate.sh

      - name: Selfhost WASI selfbuild gate (stage0 wasm -> stage1 wasm run)
        run: ./scripts/test_selfhost_wasi_selfbuild.sh

      - name: Selfhost WASI HTTP boundary gate (component WIT imports)
        run: ./scripts/test_selfhost_wasi_http_boundary.sh

  e2e-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.219.1/wasm-tools-1.219.1-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.219.1-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.219.1-x86_64-linux/wasm-tools /usr/local/bin/
          wasm-tools --version

      - name: Run Component E2E tests
        run: ./scripts/test_component_e2e.sh

      - name: Run Codegen Unsupported Syntax tests
        run: ./scripts/test_codegen_unsupported.sh
