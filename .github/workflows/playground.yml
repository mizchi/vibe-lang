name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        run: |
          moon update
          moon build --target wasm-gc --release src/lib

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playground/pnpm-lock.yaml

      - name: Install Playground deps
        run: |
          cd playground
          pnpm install --frozen-lockfile

      - name: Build Playground
        # Inlined from Taskfile.pkl `playground-build` task.
        run: |
          cp _build/wasm-gc/release/build/lib/lib.wasm playground/public/vibe-runtime.wasm
          cd playground
          VITE_BASE=/vibe-lang/ VITE_VIBE_BUILD_LABEL=$(git rev-parse --short HEAD) pnpm build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist
      - uses: actions/deploy-pages@v5
        id: deployment
