name: seed-release

# Manually triggered: publishes a bootstrap-bump seed release. Not triggered
# by tag push, because at the tag a bumper wants to publish,
# bootstrap/seed.json already points at the NEW seed (that's what "adopt"
# does) — a CI job checking out that commit can't fetch the new seed's own
# not-yet-published release to use as stage0. Instead this job is told
# explicitly which prior, already-known seed to reproduce from.
#
# prior_seed_ref is required — there is no self-referential default that
# works: source_ref's OWN bootstrap/seed.json always already describes the
# NEW seed being published here, never a usable prior one.
#
# All `${{ inputs.* }}` values are passed into scripts via `env:` and
# referenced as quoted shell variables, never interpolated directly into a
# `run:` script body — GitHub Actions expands `${{ }}` as a textual
# substitution before the shell parses the script, so interpolating an
# input directly is a shell-injection risk if that input contains shell
# metacharacters (a valid git tag can contain quotes, backslashes, etc.).
#
# See docs/bootstrap.md's "Seed artifact 配布" section for the full bump
# procedure this fits into.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag to publish (must start with seed/), e.g. seed/map-from-pairs-2026-07-17"
        required: true
      source_ref:
        description: "Commit whose compiler source to build the candidate from (defaults to the ref this workflow runs on)"
        required: false
      prior_seed_ref:
        description: "Commit/tag to source the prior (stage0) seed artifact from. Two cases: (1) a pre-#1000-part-2 commit where bootstrap/seed/{compiler,selfhost_compiler}.wasm is still git-tracked (this migration's own bootstrap case — the artifact is extracted directly, no release needed), or (2) any later commit whose OWN bootstrap/seed.json already points at a real, previously-published seed/* release (the normal steady-state case)."
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SEED_TAG: ${{ inputs.tag }}
      SOURCE_REF: ${{ inputs.source_ref }}
      PRIOR_SEED_REF: ${{ inputs.prior_seed_ref }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          case "$SEED_TAG" in
            seed/*) : ;;
            *) echo "::error::tag must start with 'seed/' (got: $SEED_TAG)"; exit 1 ;;
          esac

      - name: Reject retry against an already-published release
        # This repo has immutable releases enabled: once a release for this
        # tag is published, GitHub will never allow it to become a draft (or
        # accept new assets) again — not even via a later `gh release edit
        # --draft=false` in this same workflow. If a prior dispatch for this
        # exact tag got far enough to publish (e.g. failed asset upload before
        # this workflow had the draft-then-publish fix), action-gh-release
        # will resolve that existing published release instead of creating a
        # fresh draft, and the upload step will fail again the same way.
        # Fail fast here with actionable guidance instead of burning a full
        # build for a release that can never succeed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if info="$(gh release view "$SEED_TAG" --repo "${{ github.repository }}" --json isDraft 2>/dev/null)"; then
            is_draft="$(echo "$info" | jq -r '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $SEED_TAG already exists and is published. This repo's immutable-releases setting means it can never accept new assets, even from this workflow's draft-then-publish flow."
              echo "::error::Delete it first (gh release delete \"$SEED_TAG\" --yes --cleanup-tag) and re-dispatch, or publish under a new tag."
              exit 1
            fi
            echo "[seed-release] found existing draft release for $SEED_TAG, will reuse it"
          else
            echo "[seed-release] no existing release for $SEED_TAG"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL --fail --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"

      - name: Acquire prior seed artifact (stage0 for this rebuild)
        run: |
          set -euo pipefail
          ref="$PRIOR_SEED_REF"
          mkdir -p bootstrap/seed
          if git show "$ref:bootstrap/seed/compiler.wasm" > bootstrap/seed/compiler.wasm 2>/dev/null; then
            echo "[seed-release] extracted prior artifact directly from $ref:bootstrap/seed/compiler.wasm (still git-tracked at that ref)"
          elif git show "$ref:bootstrap/seed/selfhost_compiler.wasm" > bootstrap/seed/compiler.wasm 2>/dev/null; then
            echo "[seed-release] extracted prior artifact directly from $ref:bootstrap/seed/selfhost_compiler.wasm (pre-#1000-part-2 path, still git-tracked at that ref)"
          else
            rm -f bootstrap/seed/compiler.wasm
            echo "[seed-release] not git-tracked at $ref; using its bootstrap/seed.json pin to fetch from a prior release"
            git show "$ref:bootstrap/seed.json" > bootstrap/seed.json
            bash scripts/ensure_seed.sh
          fi
          # bootstrap/seed.json is deliberately left as $ref's own manifest
          # here (not restored to source_ref's) in the fetch branch above:
          # it must describe the artifact that's actually on disk (prior's),
          # or the next step's verify_seed_artifact sees a sha mismatch
          # against source_ref's own (new, not-yet-published) pin and tries
          # to self-referentially fetch a release that doesn't exist yet.
          # Restored to source_ref's copy right before "Adopt candidate
          # locally" below, once the build no longer needs it to match the
          # on-disk artifact.

      - name: Rebuild candidate deterministically
        run: bash scripts/generations.sh build --stage3

      - name: Adopt candidate locally (uncommitted — this workspace only)
        run: |
          set -euo pipefail
          git checkout -- bootstrap/seed.json
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          bash scripts/generations.sh adopt --artifact "${gen}stage2.wasm" \
            --tag "$SEED_TAG" --source-commit "$(git rev-parse HEAD)"

      - name: Build seed release assets
        run: bash scripts/build_seed_release_assets.sh "$SEED_TAG"

      - name: Compute artifact-safe name
        # actions/upload-artifact names can't contain the characters GitHub
        # lists (", :, <, >, |, *, ?, \r, \n, \, /) — unlike the release tag
        # itself, which allows most of them. Replace anything outside a safe
        # allowlist rather than only the "/" actually exercised so far.
        id: artifact_name
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$SEED_TAG" | tr -c 'A-Za-z0-9._-' '-')"
          echo "value=seed-release-assets-$safe" >> "$GITHUB_OUTPUT"

      - name: Upload staged assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: dist/release/${{ inputs.tag }}/*
          if-no-files-found: error

      - name: Publish GitHub Release (draft prerelease)
        # This repo has GitHub's "immutable releases" setting enabled: once a
        # release transitions to published, no more assets can be uploaded to
        # it. softprops/action-gh-release with only `prerelease: true` (no
        # `draft: true`) still fires `release.published` immediately, so the
        # asset upload in this same step fails ("Cannot upload asset ... to
        # an immutable release"). Creating it as a draft keeps it mutable
        # while assets attach; the next step flips it to published as a
        # separate, later action.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.source_ref || github.sha }}
          prerelease: true
          draft: true
          files: |
            dist/release/${{ inputs.tag }}/*
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$SEED_TAG" --draft=false --repo "${{ github.repository }}"
