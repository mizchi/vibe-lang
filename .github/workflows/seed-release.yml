name: seed-release

# Manually triggered: publishes a bootstrap-bump seed release. Not triggered
# by tag push, because at the tag a bumper wants to publish,
# bootstrap/seed.json already points at the NEW seed (that's what "adopt"
# does) — a CI job checking out that commit can't fetch the new seed's own
# not-yet-published release to use as stage0. Instead this job is told
# explicitly which prior, already-known seed to reproduce from.
#
# prior_seed_ref is required — there is no self-referential default that
# works: source_ref's OWN bootstrap/seed.json always already describes the
# NEW seed being published here, never a usable prior one.
#
# See docs/bootstrap.md's "Seed artifact 配布" section for the full bump
# procedure this fits into.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag to publish (must start with seed/), e.g. seed/map-from-pairs-2026-07-17"
        required: true
      source_ref:
        description: "Commit whose compiler source to build the candidate from (defaults to the ref this workflow runs on)"
        required: false
      prior_seed_ref:
        description: "Commit/tag to source the prior (stage0) seed artifact from. Two cases: (1) a pre-#1000-part-2 commit where bootstrap/seed/{compiler,selfhost_compiler}.wasm is still git-tracked (this migration's own bootstrap case — the artifact is extracted directly, no release needed), or (2) any later commit whose OWN bootstrap/seed.json already points at a real, previously-published seed/* release (the normal steady-state case)."
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          case "${{ inputs.tag }}" in
            seed/*) : ;;
            *) echo "::error::tag must start with 'seed/' (got: ${{ inputs.tag }})"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v46.0.1
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"

      - name: Acquire prior seed artifact (stage0 for this rebuild)
        run: |
          set -euo pipefail
          ref="${{ inputs.prior_seed_ref }}"
          mkdir -p bootstrap/seed
          if git show "$ref:bootstrap/seed/compiler.wasm" > bootstrap/seed/compiler.wasm 2>/dev/null; then
            echo "[seed-release] extracted prior artifact directly from $ref:bootstrap/seed/compiler.wasm (still git-tracked at that ref)"
          elif git show "$ref:bootstrap/seed/selfhost_compiler.wasm" > bootstrap/seed/compiler.wasm 2>/dev/null; then
            echo "[seed-release] extracted prior artifact directly from $ref:bootstrap/seed/selfhost_compiler.wasm (pre-#1000-part-2 path, still git-tracked at that ref)"
          else
            rm -f bootstrap/seed/compiler.wasm
            echo "[seed-release] not git-tracked at $ref; using its bootstrap/seed.json pin to fetch from a prior release"
            git show "$ref:bootstrap/seed.json" > bootstrap/seed.json
            bash scripts/ensure_seed.sh
            git checkout -- bootstrap/seed.json
          fi

      - name: Rebuild candidate deterministically
        run: bash scripts/generations.sh build --stage3

      - name: Adopt candidate locally (uncommitted — this workspace only)
        run: |
          gen="$(ls -dt _build/selfhost/generations/*/ | head -1)"
          bash scripts/generations.sh adopt --artifact "${gen}stage2.wasm" \
            --tag "${{ inputs.tag }}" --source-commit "$(git rev-parse HEAD)"

      - name: Build seed release assets
        run: bash scripts/build_seed_release_assets.sh "${{ inputs.tag }}"

      - name: Compute artifact-safe name
        # actions/upload-artifact names can't contain "/" (unlike the release
        # tag itself, which supports it fine) — sanitize for this step only.
        id: artifact_name
        run: echo "value=seed-release-assets-$(echo '${{ inputs.tag }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload staged assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: dist/release/${{ inputs.tag }}/*
          if-no-files-found: error

      - name: Publish GitHub Release (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.source_ref || github.sha }}
          prerelease: true
          files: |
            dist/release/${{ inputs.tag }}/*
          fail_on_unmatched_files: true
          generate_release_notes: false
