name: perf

# Continuous performance tracking (bench/perf/README.md "Continuous perf
# tracking" section):
#   - every PR gets a sticky "📊 Perf report" comment comparing its metrics
#     against the latest main baseline (updated in place on new pushes),
#   - every main push appends a snapshot to the `bench-data` branch
#     (data/main.jsonl + latest.json), which is what PRs baseline against.
#
# Metrics come from scripts/bench_metrics.sh: deterministic allocation/size
# numbers (selfcompile heap, stage2/bundle/sample-wasm sizes, bytes/op of the
# tracked `bench {}` series), deterministic execution metrics for the
# general-program corpus (bench/exec/: wasmtime fuel + memory on both the
# linear and wasm-gc backends, with golden-output and backend-parity checks),
# plus advisory wall times (collapsed in the report — CI runners are noisy).
# This workflow never blocks merges — the blocking allocation gate stays in
# ci.yml (KPI heap step).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  perf-metrics:
    name: perf-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh
      - name: Generated compiler artifacts (fingerprint)
        # The five generated artifacts are build outputs, not tracked files
        # (scripts/ensure_generated.sh). Their fingerprint is a pure function of
        # (seed, compiler source), so it also keys the stage2 cache below --
        # which is what the committed flat module source used to do via
        # hashFiles.
        id: genfp
        run: echo "fp=$(bash scripts/ensure_generated.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache generated compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            lib/@vibe/compiler/compiler_sources_bundle.vibe
            lib/@vibe/compiler/cli_adapter_bundle.vibe
            lib/@vibe/compiler/selfbuild_runtime_entry_bundle.vibe
            lib/@vibe/compiler/_cli_adapter_module_source.vibe
            lib/@vibe/compiler/cache/codegen_fingerprint.vibe
            lib/@vibe/compiler/.generated.stamp
          key: gen-v1-${{ steps.genfp.outputs.fp }}
      - name: Ensure generated compiler artifacts
        run: bash scripts/ensure_generated.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install wasmtime
        # generations.sh's per-stage validation runs a compiled sample via
        # wasmtime — required whenever the stage2 cache misses (i.e. any PR
        # that changes the compiler; cache-hit runs skipped the build and
        # masked this on the first few runs). Version pinned to ci.yml's.
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"
      - name: Cache stage2 (keyed on seed + flat module source)
        id: stage2-cache
        uses: actions/cache@v4
        with:
          path: _build/_ci_shard_gen
          key: stage2-v2-${{ steps.genfp.outputs.fp }}-${{ hashFiles('scripts/generations.sh', 'scripts/wasm_vibe_host_runner.js') }}
      - name: Build stage2 from committed flat module source
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: |
          VIBE_PREBUILT_MODULE_SOURCE=lib/@vibe/compiler/_cli_adapter_module_source.vibe \
            bash scripts/generations.sh build --out-dir _build/_ci_shard_gen
      # See cli-install.yml's "Cache cargo + runner build" step for why this
      # is Swatinem/rust-cache rather than a raw actions/cache path list: a
      # plain restore keeps archived mtimes older than the fresh checkout's,
      # so cargo re-fingerprints (and recompiles) the whole dependency tree
      # even on a cache hit.
      - name: Cache viberun build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/viberun
      - name: Build viberun (micro-bench runtime)
        run: cargo build --release --manifest-path runtime/viberun/Cargo.toml
      - name: Collect metrics
        run: |
          bash scripts/bench_metrics.sh _build/_ci_shard_gen/stage2.wasm _build/bench_metrics.json
          cat _build/bench_metrics.json
      - name: Fetch baseline from bench-data branch
        run: |
          if git fetch --depth 1 origin bench-data 2>/dev/null; then
            git show FETCH_HEAD:latest.json > _build/bench_baseline.json 2>/dev/null || true
          fi
          ls -la _build/bench_baseline.json 2>/dev/null || echo "no baseline yet"
      - name: Render report
        run: |
          node scripts/bench_report.mjs _build/bench_metrics.json _build/bench_baseline.json \
            > _build/bench_report.md
          cat _build/bench_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_build/bench_report.md', 'utf8');
            const marker = '<!-- vibe-perf-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Append snapshot to bench-data branch (main only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry loop: concurrent main pushes race on the data branch; the
          # payload is append-only so refetch + reapply + push is always safe.
          for attempt in 1 2 3; do
            rm -rf _build/bench-data
            if git fetch --depth 1 origin bench-data 2>/dev/null; then
              git worktree add _build/bench-data FETCH_HEAD
            else
              git worktree add --detach _build/bench-data
              (cd _build/bench-data && git checkout --orphan bench-data && git rm -rf --quiet . || true)
            fi
            mkdir -p _build/bench-data/data
            cat _build/bench_metrics.json | tr -d '\n' >> _build/bench-data/data/main.jsonl
            echo >> _build/bench-data/data/main.jsonl
            cp _build/bench_metrics.json _build/bench-data/latest.json
            (
              cd _build/bench-data
              git add -A
              git commit -m "perf: snapshot ${GITHUB_SHA::9}"
            )
            if git -C _build/bench-data push origin HEAD:refs/heads/bench-data; then
              break
            fi
            git worktree remove --force _build/bench-data || true
            [ "$attempt" -lt 3 ] || { echo "::error::failed to push bench-data after 3 attempts"; exit 1; }
            sleep $((attempt * 3))
          done
          git worktree remove --force _build/bench-data || true
      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-metrics
          path: |
            _build/bench_metrics.json
            _build/bench_report.md
