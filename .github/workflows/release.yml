name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One prebuilt `viberun` per target, built natively (docs/user/getting-started/install.md
  # "Updating", #2678). x86_64 macOS rides along while GitHub still hosts an
  # Intel runner; its job may fail without failing the release.
  runners:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.target == 'x86_64-apple-darwin' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build runner
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          [ "$host" = "${{ matrix.target }}" ] || { echo "runner host $host is not ${{ matrix.target }}" >&2; exit 1; }
          cargo build --release --manifest-path runtime/viberun/Cargo.toml

      - name: Package runner
        run: |
          set -euo pipefail
          mkdir -p dist/release/runners
          tar -czf "dist/release/runners/viberun-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            -C runtime/viberun/target/release viberun

      - name: Upload runner
        uses: actions/upload-artifact@v6
        with:
          name: viberun-${{ matrix.target }}
          path: dist/release/runners/viberun-*.tar.gz
          if-no-files-found: error

  github-release:
    needs: runners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # bootstrap/seed/compiler.wasm is a local build cache (gitignored,
      # not git-tracked) — fetch it from its pinned release tag before
      # building. Selfhost-only (#594): no MoonBit toolchain, no wasmtime
      # needed, just the node wasm runner.
      - name: Ensure seed artifact
        run: bash scripts/ensure_seed.sh

      - name: Download runner tarballs
        uses: actions/download-artifact@v6
        with:
          pattern: viberun-*
          path: dist/release/runners
          merge-multiple: true

      - name: Build release assets
        run: bash scripts/build_release_assets.sh "${GITHUB_REF_NAME}"

      - name: Upload staged assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/release/${{ github.ref_name }}/*
          if-no-files-found: error

      # The body is the release notes that ship in the repository, not the
      # list of merged pull requests `generate_release_notes` produces: that
      # was 72 entries for 0.1.0 against a `v0.0.1` five months earlier, and
      # 0.1.0 is the first release usable by anyone but the author, so the
      # page a newcomer lands on should be the written account.
      #
      # The notes are written to be read inside `docs/`, so their links are
      # relative and a release body resolves none of them.
      # build_release_body.sh absolutizes those AT THE TAG and REFUSES a link
      # that does not resolve -- a body cannot be corrected after publishing
      # here (immutable releases), so a dead link would be permanent.
      - name: Build release body
        run: bash scripts/build_release_body.sh "${GITHUB_REF_NAME}" "$RUNNER_TEMP/release-body.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/${{ github.ref_name }}/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
          # This repository has IMMUTABLE RELEASES enabled, so assets can only
          # be attached BEFORE the release is published. Publishing directly --
          # which is what this step did until v0.1.0-rc.0 -- creates the
          # release, then loses every asset upload to:
          #
          #   Cannot upload asset vibe-toolchain-v0.1.0-rc.0.tar.gz to an
          #   immutable release. GitHub only allows asset uploads before a
          #   release is published
          #
          # and the result is a PUBLISHED release carrying zero downloads,
          # which cannot be corrected in place for the same reason. The
          # workflow already knew this rule for the BODY (see
          # build_release_body.sh's link absolutization, which refuses a dead
          # link because "a body cannot be corrected after publishing here");
          # nobody had connected it to the assets.
          #
          # So stage as a draft, upload into the draft, and promote below.
          # `release-install` is `needs: github-release`, a job dependency
          # rather than an event subscription, so the action's own caveat
          # about `release.published` vs `release.prereleased` does not reach
          # anything here.
          draft: true
          # A pre-release tag (`v0.1.0-rc.0`) must NOT become the repository's
          # "Latest release": the README's installer and every "download the
          # latest" instruction resolve to that pointer, so publishing a
          # candidate as latest hands it to everyone who follows the front
          # page. The tag's own spelling decides -- a hyphen is SemVer's
          # pre-release marker, the same reduction check_version_ladder.sh and
          # build_release_body.sh make -- so nothing has to be remembered at
          # tag time.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Flip the staged draft to published, with its assets already attached.
      # `--draft=false` changes only that field, so the `prerelease` decision
      # made above survives -- verified below rather than assumed, because a
      # candidate silently promoted to a full release is the failure the
      # `prerelease` line exists to prevent.
      - name: Promote the staged draft to a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          # Expected asset count comes from what was actually staged, not a
          # literal: a hardcoded number silently stops checking the moment the
          # asset set changes.
          want_assets="$(find "dist/release/${GITHUB_REF_NAME}" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [ "$want_assets" -gt 0 ] || { echo "no staged assets to compare against" >&2; exit 1; }
          case "${GITHUB_REF_NAME}" in
            *-*) want_pre=true ;;
            *)   want_pre=false ;;
          esac
          state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"')"
          echo "published: $state (expected assets=$want_assets)"
          [ "$state" = "draft=false prerelease=$want_pre assets=$want_assets" ] || {
            echo "release did not publish as expected" >&2
            echo "  want: draft=false prerelease=$want_pre assets=$want_assets" >&2
            echo "  got:  $state" >&2
            exit 1
          }

  # The published release installs the way a user installs it
  # (docs/user/getting-started/install.md "Installer options", #2678): the curl entry point in
  # release mode, on a fresh machine, with nothing but bash, curl and tar --
  # then the installed toolchain compiles and runs a program.
  release-install:
    needs: github-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the published release
        run: |
          set -euo pipefail
          export VIBE_HOME="$RUNNER_TEMP/vibe-home"
          cat install/install.sh | bash -s -- --version "${GITHUB_REF_NAME#v}" --no-modify-path
          "$VIBE_HOME/bin/vibe" version
          printf 'fn main allows Console {\n  println("42")\n}\n' > "$RUNNER_TEMP/hello.vibex"
          out="$(cd "$RUNNER_TEMP" && "$VIBE_HOME/bin/vibe" run hello.vibex)"
          [ "$out" = "42" ] || { echo "installed release printed '$out'" >&2; exit 1; }
