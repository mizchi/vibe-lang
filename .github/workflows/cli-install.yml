name: cli-install

# Build the wasmtime runner and smoke-test the `vibe` install slice
# (docs/release-roadmap.md テーマ1) on each supported OS. Keeps the
# runner ↔ compiler-wasm ↔ launcher contract from regressing.

on:
  push:
    branches: [main]
    paths:
      - "tools/moonrun_wasmtime/**"
      - "runtime/vibe"
      - "scripts/install.sh"
      - "scripts/build_cli_wasm.sh"
      - "scripts/test_vibe_cli_install.sh"
      - "bootstrap/selfhost/seed/**"
      - ".github/workflows/cli-install.yml"
  pull_request:
    paths:
      - "tools/moonrun_wasmtime/**"
      - "runtime/vibe"
      - "scripts/install.sh"
      - "scripts/build_cli_wasm.sh"
      - "scripts/test_vibe_cli_install.sh"
      - ".github/workflows/cli-install.yml"
  workflow_dispatch:

concurrency:
  group: cli-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache cargo + runner build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/moonrun_wasmtime/target
          key: cli-install-cargo-${{ matrix.os }}-${{ hashFiles('tools/moonrun_wasmtime/Cargo.lock', 'tools/moonrun_wasmtime/src/**') }}
          restore-keys: |
            cli-install-cargo-${{ matrix.os }}-

      - name: Build runner
        run: cargo build --release --manifest-path tools/moonrun_wasmtime/Cargo.toml

      - name: Install (seed compiler) + smoke test
        run: bash scripts/test_vibe_cli_install.sh
