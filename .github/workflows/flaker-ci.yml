name: flaker-ci

on:
  # Manual-only: rewired from the retired MoonBit-host suite (#594) to the
  # selfhost unit-test battery (#988 — flaker.toml custom runner via
  # scripts/flaker_vibe_runner.mjs). Keep on workflow_dispatch until main
  # accumulates a trusted baseline of selfhost runs, then wire into
  # pull_request/push.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sampled-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache seed artifact
        uses: actions/cache@v4
        with:
          path: bootstrap/seed/compiler.wasm
          key: seed-artifact-${{ hashFiles('bootstrap/seed.json') }}

      - name: Ensure seed artifact
        # bootstrap/seed/compiler.wasm is a local build cache (gitignored,
        # not git-tracked) — the compiler build the suite compiles against
        # needs it.
        run: bash scripts/ensure_seed.sh
      - name: Generated compiler artifacts (fingerprint)
        # Build outputs, not tracked files -- see scripts/ensure_generated.sh.
        id: genfp
        run: echo "fp=$(bash scripts/ensure_generated.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache generated compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            lib/@vibe/compiler/compiler_sources_bundle.vibe
            lib/@vibe/compiler/cli_adapter_bundle.vibe
            lib/@vibe/compiler/selfbuild_runtime_entry_bundle.vibe
            lib/@vibe/compiler/_cli_adapter_module_source.vibe
            lib/@vibe/compiler/cache/codegen_fingerprint.vibe
            lib/@vibe/compiler/.generated.stamp
          key: gen-v1-${{ steps.genfp.outputs.fp }}
      - name: Ensure generated compiler artifacts
        run: bash scripts/ensure_generated.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install wasmtime
        # Optional for the unit-test battery: allowlisted files that shell
        # out to the wasmtime CLI are skipped when it is missing (#769).
        # Install it so sampled runs cover them. Version pinned to ci.yml's.
        env:
          WASMTIME_VERSION: v47.0.2
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz" | tar -xJ
          echo "$PWD/$dir" >> "$GITHUB_PATH"

      - name: Install flaker
        run: npm install -g @mizchi/flaker

      - name: Restore flaker DB
        # SHA-version the main baseline so subsequent main pushes can
        # update it (`actions/cache` save is immutable per-key). Restore
        # via the `flaker-db-main-` prefix only — never fall back to
        # PR-saved caches, which historically polluted the gate with
        # stale test names from older branches.
        uses: actions/cache/restore@v5
        with:
          path: .flaker/
          key: flaker-db-main-${{ github.sha }}
          restore-keys: flaker-db-main-

      - name: Compute changed files
        # The `hybrid` strategy in `profile.ci` resolves changed files to
        # affected suites; without a changed-file list flaker throws
        # "hybrid mode requires resolver and changedFiles". `actions/checkout`
        # fetches only the shallow PR merge ref, so flaker's own
        # `origin/main` diff comes back empty. Source the list from the
        # GitHub API instead (no extra git history fetch needed).
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            let files = [];
            if (context.eventName === 'pull_request') {
              const it = github.paginate.iterator(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              for await (const { data } of it) {
                files.push(...data.map((f) => f.filename));
              }
            } else if (context.eventName === 'push') {
              const base = context.payload.before;
              const head = context.payload.after;
              // `before` is all-zeros for a brand-new branch push.
              if (base && !/^0+$/.test(base) && head) {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${base}...${head}`,
                });
                files = (cmp.data.files || []).map((f) => f.filename);
              }
            }
            core.info(`changed files: ${files.length}`);
            core.setOutput('files', files.join(','));
            core.setOutput('count', String(files.length));

      - name: Sampled test run
        # `continue-on-error`: keep the gate visible but non-blocking until
        # main accumulates a baseline of real selfhost runs; flip to
        # blocking once the signal is trusted. Note: without a prebuilt
        # VIBE_STAGE2_WASM the first execute performs a fresh
        # seed->stage1->stage2 selfbuild (scripts/unit_test_runner.sh).
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          CHANGED_COUNT: ${{ steps.changed.outputs.count }}
        run: |
          if [ "${CHANGED_COUNT:-0}" -gt 0 ]; then
            echo "Running hybrid sampling against $CHANGED_COUNT changed file(s)"
            flaker run --profile ci --changed "$CHANGED_FILES"
          else
            echo "No changed files detected; falling back to weighted sampling"
            flaker run --profile ci --strategy weighted
          fi

      - name: Save flaker DB (main baseline)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .flaker/
          key: flaker-db-main-${{ github.sha }}

      - name: Save flaker DB (PR run)
        if: github.event_name == 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .flaker/
          key: flaker-db-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
